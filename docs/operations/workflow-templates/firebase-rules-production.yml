# INERT TEMPLATE: GitHub does not discover workflows outside .github/workflows.
# Do not activate until every gate in
# docs/operations/production-deployment-controls.md is closed.
name: Deploy Firebase rules to production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch commit SHA approved for deployment
        required: true
        type: string
      confirmation:
        description: Type DEPLOY RULES tenacity-tutoring-b8eb2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tenacity-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TOOLS_VERSION: 15.20.0
  FIREBASE_TARGET: production
  FIREBASE_PROJECT_ID: tenacity-tutoring-b8eb2
  FIREBASE_STORAGE_BUCKET: tenacity-tutoring-b8eb2.firebasestorage.app
  FIREBASE_STORAGE_TARGET: primary
  FIREBASE_DATABASE_ID: (default)

jobs:
  validate:
    name: Validate exact rules source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Reject an unapproved ref or confirmation
        timeout-minutes: 1
        env:
          APPROVED_SHA: ${{ inputs.git_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$APPROVED_SHA" ]]
          [[ "$CONFIRMATION" == "DEPLOY RULES tenacity-tutoring-b8eb2" ]]
      - name: Check out approved commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json
      - name: Set up Java
        timeout-minutes: 3
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install exact dependencies
        timeout-minutes: 8
        run: |
          npm ci --prefix apps/admin-portal
          npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Validate source and emulator behavior
        timeout-minutes: 15
        run: |
          node scripts/ci/validate-firebase-config.mjs
          npm --prefix apps/admin-portal run test:rules

  deploy:
    name: Approved rules deployment
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: tenacity-production
    steps:
      - name: Check out approved commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Recheck approved SHA after environment approval
        id: recheck_sha
        timeout-minutes: 2
        env:
          APPROVED_SHA: ${{ inputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$APPROVED_SHA" ]]
      - name: Verify the production environment and reviewed target are armed
        id: arm_target
        timeout-minutes: 2
        env:
          DEPLOYS_ENABLED: ${{ vars.TENACITY_PRODUCTION_DEPLOYS_ENABLED }}
          CONFIGURED_TARGET: ${{ vars.FIREBASE_DEPLOYMENT_TARGET }}
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          CONFIGURED_STORAGE_TARGET: ${{ vars.FIREBASE_STORAGE_TARGET }}
          CONFIGURED_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
        run: |
          [[ "$DEPLOYS_ENABLED" == "true" ]]
          [[ "$CONFIGURED_TARGET" == "$FIREBASE_TARGET" ]]
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_STORAGE_BUCKET" == "$FIREBASE_STORAGE_BUCKET" ]]
          [[ "$CONFIGURED_STORAGE_TARGET" == "$FIREBASE_STORAGE_TARGET" ]]
          [[ "$CONFIGURED_DATABASE_ID" == "$FIREBASE_DATABASE_ID" ]]
          node --input-type=module -e '
            import { assertFirebaseDeploymentTarget } from "./scripts/firebase/firebase-targets.mjs";
            assertFirebaseDeploymentTarget({
              targetName: process.env.FIREBASE_TARGET,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
              databaseId: process.env.FIREBASE_DATABASE_ID,
            });
          '
      - name: Install pinned Firebase CLI
        id: install_cli
        timeout-minutes: 5
        run: npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Configure scoped Firebase credentials
        id: configure_credentials
        timeout-minutes: 2
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]
          umask 077
          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          evidence_dir="${RUNNER_TEMP}/firebase-rules-evidence"
          mkdir -p "$evidence_dir"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"
      - name: Capture current Rules releases and immutable source
        id: capture_before_rules
        timeout-minutes: 5
        run: |
          node scripts/firebase/firebase-rules-state.mjs capture \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --output "${RUNNER_TEMP}/firebase-rules-evidence/rules-before.json"
      - name: Require exact content equality with the extracted rules
        id: verify_before_rules
        timeout-minutes: 3
        run: |
          node scripts/firebase/firebase-rules-state.mjs verify \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --snapshot "${RUNNER_TEMP}/firebase-rules-evidence/rules-before.json" \
            --allow-source-name-mismatch \
            > "${RUNNER_TEMP}/firebase-rules-evidence/rules-before-verification.json"
      - name: Privileged deployment dry run
        id: dry_run_rules
        timeout-minutes: 8
        run: |
          firebase deploy \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --only "firestore:rules,storage:${FIREBASE_STORAGE_TARGET}" \
            --dry-run \
            --non-interactive
      - name: Deploy Firestore and Storage rules
        id: deploy_rules
        timeout-minutes: 10
        continue-on-error: true
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-evidence"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          firebase deploy \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --only "firestore:rules,storage:${FIREBASE_STORAGE_TARGET}" \
            --non-interactive \
            2>&1 | tee "${evidence_dir}/rules-deploy.log"
          deploy_exit_code="${PIPESTATUS[0]}"
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"exitCode":%s,"startedAt":"%s","finishedAt":"%s"}\n' \
            "$deploy_exit_code" "$started_at" "$finished_at" \
            > "${evidence_dir}/rules-deploy-status.json"
          exit "$deploy_exit_code"
      - name: Capture Rules state after the attempted deployment
        id: capture_after_rules
        if: always() && steps.deploy_rules.outcome != 'skipped'
        timeout-minutes: 5
        run: |
          node scripts/firebase/firebase-rules-state.mjs capture \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --output "${RUNNER_TEMP}/firebase-rules-evidence/rules-after.json"
      - name: Verify exact deployed source and names
        id: verify_after_rules
        if: always() && steps.deploy_rules.outcome != 'skipped'
        timeout-minutes: 3
        run: |
          node scripts/firebase/firebase-rules-state.mjs verify \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --snapshot "${RUNNER_TEMP}/firebase-rules-evidence/rules-after.json" \
            > "${RUNNER_TEMP}/firebase-rules-evidence/rules-after-verification.json"
      - name: Verify the guarded rollback preflight
        id: rollback_preflight
        if: always() && steps.deploy_rules.outcome != 'skipped'
        timeout-minutes: 4
        run: |
          node scripts/firebase/firebase-rules-state.mjs rollback \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --prior-snapshot "${RUNNER_TEMP}/firebase-rules-evidence/rules-before.json" \
            --current-snapshot "${RUNNER_TEMP}/firebase-rules-evidence/rules-after.json" \
            > "${RUNNER_TEMP}/firebase-rules-evidence/rules-rollback-preflight.json"
      - name: Create required Rules evidence manifest
        id: evidence_manifest
        if: always()
        timeout-minutes: 2
        env:
          ARMED_OUTCOME: ${{ steps.arm_target.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run_rules.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_rules.outcome }}
          CAPTURE_BEFORE_OUTCOME: ${{ steps.capture_before_rules.outcome }}
          VERIFY_BEFORE_OUTCOME: ${{ steps.verify_before_rules.outcome }}
          CAPTURE_AFTER_OUTCOME: ${{ steps.capture_after_rules.outcome }}
          VERIFY_AFTER_OUTCOME: ${{ steps.verify_after_rules.outcome }}
          ROLLBACK_PREFLIGHT_OUTCOME: ${{ steps.rollback_preflight.outcome }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-evidence"
          node scripts/firebase/deployment-evidence-manifest.mjs create \
            --type firebase-rules-deployment \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --job deploy \
            --outcome "armed=${ARMED_OUTCOME:-unknown}" \
            --outcome "captureBefore=${CAPTURE_BEFORE_OUTCOME:-unknown}" \
            --outcome "verifyBefore=${VERIFY_BEFORE_OUTCOME:-unknown}" \
            --outcome "dryRun=${DRY_RUN_OUTCOME:-unknown}" \
            --outcome "deploy=${DEPLOY_OUTCOME:-unknown}" \
            --outcome "captureAfter=${CAPTURE_AFTER_OUTCOME:-unknown}" \
            --outcome "verifyAfter=${VERIFY_AFTER_OUTCOME:-unknown}" \
            --outcome "rollbackPreflight=${ROLLBACK_PREFLIGHT_OUTCOME:-unknown}" \
            --file "rulesBefore=${evidence_dir}/rules-before.json" \
            --file "rulesBeforeVerification=${evidence_dir}/rules-before-verification.json" \
            --file "deployLog=${evidence_dir}/rules-deploy.log" \
            --file "deployStatus=${evidence_dir}/rules-deploy-status.json" \
            --file "rulesAfter=${evidence_dir}/rules-after.json" \
            --file "rulesAfterVerification=${evidence_dir}/rules-after-verification.json" \
            --file "rollbackPreflight=${evidence_dir}/rules-rollback-preflight.json" \
            --output "${evidence_dir}/evidence-manifest.json"
      - name: Require complete Rules deployment evidence
        id: verify_evidence_manifest
        if: always()
        timeout-minutes: 2
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-evidence"
          node scripts/firebase/deployment-evidence-manifest.mjs verify \
            --manifest "${evidence_dir}/evidence-manifest.json" \
            --artifact-directory "$evidence_dir" \
            --type firebase-rules-deployment \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --require-file rulesBefore \
            --require-file rulesBeforeVerification \
            --require-file deployLog \
            --require-file deployStatus \
            --require-file rulesAfter \
            --require-file rulesAfterVerification \
            --require-file rollbackPreflight \
            --require-outcome armed=success \
            --require-outcome captureBefore=success \
            --require-outcome verifyBefore=success \
            --require-outcome dryRun=success \
            --require-outcome deploy=success \
            --require-outcome captureAfter=success \
            --require-outcome verifyAfter=success \
            --require-outcome rollbackPreflight=success \
            > "${evidence_dir}/evidence-manifest-verification.json"
      - name: Upload Rules deployment evidence
        id: upload_evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-rules-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firebase-rules-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary credentials
        id: cleanup_credentials
        if: always()
        timeout-minutes: 1
        run: rm -f "${RUNNER_TEMP}/firebase-service-account.json"
      - name: Reject any failed deployment or evidence step
        if: always()
        timeout-minutes: 1
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_rules.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify_evidence_manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          [[ "$DEPLOY_OUTCOME" == "success" ]]
          [[ "$EVIDENCE_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
