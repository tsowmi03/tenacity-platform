# INERT STAGING TEMPLATE: GitHub does not discover workflows outside .github/workflows.
# Do not activate until the staging target, credential, and environment gates in
# docs/operations/firebase-staging-rehearsal.md are closed.
name: Rehearse Firestore indexes in staging

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch commit SHA authorized for rehearsal
        required: true
        type: string
      scenario:
        description: Select the staging index scenario
        required: true
        type: choice
        options:
          - bootstrap
          - noop
      confirmation:
        description: Type the scenario-specific staging confirmation including SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tenacity-staging
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TOOLS_VERSION: 15.20.0
  FIREBASE_TARGET: staging
  FIREBASE_PROJECT_ID: tenacity-tutoring-staging
  FIREBASE_DATABASE_ID: (default)

jobs:
  validate:
    name: Validate exact staging index source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject an unauthorized ref or confirmation
        timeout-minutes: 1
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          SCENARIO: ${{ inputs.scenario }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$AUTHORIZED_SHA" ]]
          case "$SCENARIO" in
            bootstrap)
              expected="BOOTSTRAP INDEXES tenacity-tutoring-staging ${AUTHORIZED_SHA}"
              ;;
            noop)
              expected="REHEARSE INDEXES tenacity-tutoring-staging ${AUTHORIZED_SHA}"
              ;;
            *)
              exit 1
              ;;
          esac
          [[ "$CONFIRMATION" == "$expected" ]]
      - name: Check out authorized commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate manifest and reviewed source hash
        timeout-minutes: 5
        run: node scripts/ci/validate-firebase-config.mjs

  rehearse:
    name: Authorized staging index rehearsal
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: tenacity-staging
    env:
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Check out authorized commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Recheck authorized SHA after environment gate
        id: recheck_sha
        timeout-minutes: 2
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$AUTHORIZED_SHA" ]]
      - name: Verify the staging environment and reviewed target are armed
        id: target_gate
        timeout-minutes: 2
        env:
          REHEARSALS_ENABLED: ${{ vars.TENACITY_STAGING_REHEARSALS_ENABLED }}
          CONFIGURED_TARGET: ${{ vars.FIREBASE_DEPLOYMENT_TARGET }}
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
        run: |
          [[ "$REHEARSALS_ENABLED" == "true" ]]
          [[ "$CONFIGURED_TARGET" == "$FIREBASE_TARGET" ]]
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_DATABASE_ID" == "$FIREBASE_DATABASE_ID" ]]
          [[ -n "$FIREBASE_STORAGE_BUCKET" ]]
          node --input-type=module -e '
            import { assertFirebaseDeploymentTarget } from "./scripts/firebase/firebase-targets.mjs";
            assertFirebaseDeploymentTarget({
              targetName: process.env.FIREBASE_TARGET,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
              databaseId: process.env.FIREBASE_DATABASE_ID,
            });
          '
      - name: Install pinned Firebase CLI
        id: install_cli
        timeout-minutes: 5
        run: npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Configure scoped staging credentials
        id: configure_credentials
        timeout-minutes: 2
        env:
          FIREBASE_STAGING_INDEXES_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_STAGING_INDEXES_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$FIREBASE_STAGING_INDEXES_SERVICE_ACCOUNT_JSON" ]]
          umask 077
          credentials_file="${RUNNER_TEMP}/firebase-staging-service-account.json"
          evidence_dir="${RUNNER_TEMP}/firebase-index-staging-evidence"
          mkdir -p "$evidence_dir"
          printf '%s' "$FIREBASE_STAGING_INDEXES_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          CREDENTIALS_PATH="$credentials_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const credentials = JSON.parse(readFileSync(process.env.CREDENTIALS_PATH, "utf8"));
            if (credentials.type !== "service_account") {
              throw new Error("Staging index credential is not a service-account key.");
            }
            if (credentials.project_id !== process.env.FIREBASE_PROJECT_ID) {
              throw new Error("Staging credential project differs.");
            }
            const expectedEmail = "tenacity-staging-indexes@tenacity-tutoring-staging.iam.gserviceaccount.com";
            if (credentials.client_email !== expectedEmail) {
              throw new Error("Staging index credential identity differs.");
            }
            if (
              typeof credentials.private_key !== "string" ||
              !credentials.private_key.includes("-----BEGIN PRIVATE KEY-----") ||
              !credentials.private_key.includes("-----END PRIVATE KEY-----")
            ) {
              throw new Error("Staging index credential private key is invalid.");
            }
          '
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"
      - name: Record the selected staging scenario
        id: record_scenario
        timeout-minutes: 1
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          REPORT_PATH="${RUNNER_TEMP}/firebase-index-staging-evidence/scenario.json" \
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              writeFileSync(process.env.REPORT_PATH, `${JSON.stringify({
                scenario: process.env.SCENARIO,
                target: process.env.FIREBASE_TARGET,
                projectId: process.env.FIREBASE_PROJECT_ID,
                gitSha: process.env.GITHUB_SHA,
              }, null, 2)}\n`, { mode: 0o600 });
            '
      - name: Capture staging indexes before rehearsal
        id: capture_before_indexes
        timeout-minutes: 6
        run: |
          node scripts/firebase/firestore-index-state.mjs capture \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --database "$FIREBASE_DATABASE_ID" \
            --output "${RUNNER_TEMP}/firebase-index-staging-evidence/indexes-before.json"
      - name: Assess the captured staging index state
        id: assess_before_indexes
        timeout-minutes: 4
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-staging-evidence"
          if [[ "$SCENARIO" == "noop" ]]; then
            node scripts/firebase/firestore-index-state.mjs verify \
              --target "$FIREBASE_TARGET" \
              --project "$FIREBASE_PROJECT_ID" \
              --database "$FIREBASE_DATABASE_ID" \
              --snapshot "${evidence_dir}/indexes-before.json" \
              --source backend/firebase/indexes/firestore.indexes.json \
              --report "${evidence_dir}/indexes-before-assessment.json"
          else
            SNAPSHOT_PATH="${evidence_dir}/indexes-before.json" \
            REPORT_PATH="${evidence_dir}/indexes-before-assessment.json" \
              node --input-type=module -e '
                import { readFileSync, writeFileSync } from "node:fs";
                const snapshot = JSON.parse(readFileSync(process.env.SNAPSHOT_PATH, "utf8"));
                if (snapshot.projectId !== process.env.FIREBASE_PROJECT_ID) {
                  throw new Error("Bootstrap snapshot project differs.");
                }
                if (snapshot.databaseId !== process.env.FIREBASE_DATABASE_ID) {
                  throw new Error("Bootstrap snapshot database differs.");
                }
                writeFileSync(process.env.REPORT_PATH, `${JSON.stringify({
                  scenario: "bootstrap",
                  sourceEqualityRequiredBeforeDeploy: false,
                  snapshotDigestSha256: snapshot.snapshotDigestSha256,
                }, null, 2)}\n`, { mode: 0o600 });
              '
          fi
      - name: Run staging index deployment dry run
        id: dry_run_indexes
        timeout-minutes: 8
        run: |
          firebase deploy \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:indexes \
            --dry-run \
            --non-interactive
      - name: Deploy canonical indexes to staging
        id: deploy_indexes
        timeout-minutes: 15
        continue-on-error: true
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-staging-evidence"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          firebase deploy \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:indexes \
            --non-interactive \
            2>&1 | tee "${evidence_dir}/indexes-deploy.log"
          deploy_exit_code="${PIPESTATUS[0]}"
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"exitCode":%s,"startedAt":"%s","finishedAt":"%s"}\n' \
            "$deploy_exit_code" "$started_at" "$finished_at" \
            > "${evidence_dir}/indexes-deploy-status.json"
          exit "$deploy_exit_code"
      - name: Wait for every managed staging index to become READY
        id: capture_after_indexes
        if: always() && steps.deploy_indexes.outcome == 'success'
        timeout-minutes: 95
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-staging-evidence"
          candidate="${evidence_dir}/indexes-after-candidate.json"
          output="${evidence_dir}/indexes-after.json"
          for attempt in $(seq 1 180); do
            rm -f "$candidate"
            if node scripts/firebase/firestore-index-state.mjs capture \
              --target "$FIREBASE_TARGET" \
              --project "$FIREBASE_PROJECT_ID" \
              --database "$FIREBASE_DATABASE_ID" \
              --output "$candidate"; then
              mv "$candidate" "$output"
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Require canonical indexes after rehearsal
        id: verify_after_indexes
        if: always() && steps.capture_after_indexes.outcome == 'success'
        timeout-minutes: 5
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-staging-evidence"
          args=(
            verify
            --target "$FIREBASE_TARGET"
            --project "$FIREBASE_PROJECT_ID"
            --database "$FIREBASE_DATABASE_ID"
            --snapshot "${evidence_dir}/indexes-after.json"
            --source backend/firebase/indexes/firestore.indexes.json
            --report "${evidence_dir}/indexes-after-verification.json"
          )
          if [[ "$SCENARIO" == "noop" ]]; then
            args+=(--baseline "${evidence_dir}/indexes-before.json")
          fi
          node scripts/firebase/firestore-index-state.mjs "${args[@]}"
      - name: Create required staging index evidence manifest
        id: evidence_manifest
        if: always()
        timeout-minutes: 2
        env:
          TARGET_GATE_OUTCOME: ${{ steps.target_gate.outcome }}
          SCENARIO_OUTCOME: ${{ steps.record_scenario.outcome }}
          CAPTURE_BEFORE_OUTCOME: ${{ steps.capture_before_indexes.outcome }}
          ASSESS_BEFORE_OUTCOME: ${{ steps.assess_before_indexes.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run_indexes.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_indexes.outcome }}
          CAPTURE_AFTER_OUTCOME: ${{ steps.capture_after_indexes.outcome }}
          VERIFY_AFTER_OUTCOME: ${{ steps.verify_after_indexes.outcome }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-staging-evidence"
          node scripts/firebase/deployment-evidence-manifest.mjs create \
            --type firebase-index-staging-rehearsal \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --job rehearse \
            --outcome "targetGate=${TARGET_GATE_OUTCOME:-unknown}" \
            --outcome "scenario=${SCENARIO_OUTCOME:-unknown}" \
            --outcome "captureBefore=${CAPTURE_BEFORE_OUTCOME:-unknown}" \
            --outcome "assessBefore=${ASSESS_BEFORE_OUTCOME:-unknown}" \
            --outcome "dryRun=${DRY_RUN_OUTCOME:-unknown}" \
            --outcome "deploy=${DEPLOY_OUTCOME:-unknown}" \
            --outcome "captureAfter=${CAPTURE_AFTER_OUTCOME:-unknown}" \
            --outcome "verifyAfter=${VERIFY_AFTER_OUTCOME:-unknown}" \
            --file "scenario=${evidence_dir}/scenario.json" \
            --file "indexesBefore=${evidence_dir}/indexes-before.json" \
            --file "indexesBeforeAssessment=${evidence_dir}/indexes-before-assessment.json" \
            --file "deployLog=${evidence_dir}/indexes-deploy.log" \
            --file "deployStatus=${evidence_dir}/indexes-deploy-status.json" \
            --file "indexesAfter=${evidence_dir}/indexes-after.json" \
            --file "indexesAfterVerification=${evidence_dir}/indexes-after-verification.json" \
            --output "${evidence_dir}/evidence-manifest.json"
      - name: Require complete staging index evidence
        id: verify_evidence_manifest
        if: always()
        timeout-minutes: 2
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-staging-evidence"
          node scripts/firebase/deployment-evidence-manifest.mjs verify \
            --manifest "${evidence_dir}/evidence-manifest.json" \
            --artifact-directory "$evidence_dir" \
            --type firebase-index-staging-rehearsal \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --require-file scenario \
            --require-file indexesBefore \
            --require-file indexesBeforeAssessment \
            --require-file deployLog \
            --require-file deployStatus \
            --require-file indexesAfter \
            --require-file indexesAfterVerification \
            --require-outcome targetGate=success \
            --require-outcome scenario=success \
            --require-outcome captureBefore=success \
            --require-outcome assessBefore=success \
            --require-outcome dryRun=success \
            --require-outcome deploy=success \
            --require-outcome captureAfter=success \
            --require-outcome verifyAfter=success \
            > "${evidence_dir}/evidence-manifest-verification.json"
      - name: Upload staging index evidence
        id: upload_evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-index-staging-rehearsal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firebase-index-staging-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary staging credentials
        id: cleanup_credentials
        if: always()
        timeout-minutes: 1
        run: rm -f "${RUNNER_TEMP}/firebase-staging-service-account.json"
      - name: Reject any failed rehearsal or evidence step
        if: always()
        timeout-minutes: 1
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_indexes.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify_evidence_manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          [[ "$DEPLOY_OUTCOME" == "success" ]]
          [[ "$EVIDENCE_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
