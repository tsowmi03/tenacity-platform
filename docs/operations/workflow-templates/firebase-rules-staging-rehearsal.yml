# INERT STAGING TEMPLATE: GitHub does not discover workflows outside .github/workflows.
# Do not activate until the staging target, credential, and environment gates in
# docs/operations/firebase-staging-rehearsal.md are closed.
name: Rehearse Firebase rules in staging

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch commit SHA authorized for rehearsal
        required: true
        type: string
      scenario:
        description: Select the staging Rules scenario
        required: true
        type: choice
        options:
          - bootstrap
          - noop
          - partial
      confirmation:
        description: Type the scenario-specific staging confirmation including SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tenacity-staging
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TOOLS_VERSION: 15.20.0
  FIREBASE_TARGET: staging
  FIREBASE_PROJECT_ID: tenacity-tutoring-staging
  FIREBASE_STORAGE_TARGET: primary
  FIREBASE_DATABASE_ID: (default)
  PARTIAL_RULES_FIXTURE_SHA256: cd5089e4e5116dbb994013dc5fd5e7e411ec348935b8d06d13acd00173cca15b

jobs:
  validate:
    name: Validate exact staging Rules source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Reject an unauthorized ref or confirmation
        timeout-minutes: 1
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          SCENARIO: ${{ inputs.scenario }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$AUTHORIZED_SHA" ]]
          case "$SCENARIO" in
            bootstrap)
              expected="BOOTSTRAP RULES tenacity-tutoring-staging ${AUTHORIZED_SHA}"
              ;;
            noop)
              expected="REHEARSE RULES tenacity-tutoring-staging ${AUTHORIZED_SHA}"
              ;;
            partial)
              expected="APPLY DENY-ALL FIRESTORE RULES tenacity-tutoring-staging ${PARTIAL_RULES_FIXTURE_SHA256} ${AUTHORIZED_SHA}"
              ;;
            *)
              exit 1
              ;;
          esac
          [[ "$CONFIRMATION" == "$expected" ]]
      - name: Check out authorized commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json
      - name: Set up Java
        timeout-minutes: 3
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install exact dependencies
        timeout-minutes: 8
        run: |
          npm ci --prefix apps/admin-portal
          npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Validate source and emulator behavior
        timeout-minutes: 15
        run: |
          node scripts/ci/validate-firebase-config.mjs
          npm --prefix apps/admin-portal run test:rules

  rehearse:
    name: Authorized staging Rules rehearsal
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: tenacity-staging
    env:
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Check out authorized commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Recheck authorized SHA after environment gate
        id: recheck_sha
        timeout-minutes: 2
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$AUTHORIZED_SHA" ]]
      - name: Verify the staging environment and reviewed target are armed
        id: target_gate
        timeout-minutes: 2
        env:
          REHEARSALS_ENABLED: ${{ vars.TENACITY_STAGING_REHEARSALS_ENABLED }}
          CONFIGURED_TARGET: ${{ vars.FIREBASE_DEPLOYMENT_TARGET }}
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_STORAGE_TARGET: ${{ vars.FIREBASE_STORAGE_TARGET }}
          CONFIGURED_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
        run: |
          [[ "$REHEARSALS_ENABLED" == "true" ]]
          [[ "$CONFIGURED_TARGET" == "$FIREBASE_TARGET" ]]
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_STORAGE_TARGET" == "$FIREBASE_STORAGE_TARGET" ]]
          [[ "$CONFIGURED_DATABASE_ID" == "$FIREBASE_DATABASE_ID" ]]
          [[ -n "$FIREBASE_STORAGE_BUCKET" ]]
          node --input-type=module -e '
            import { assertFirebaseDeploymentTarget } from "./scripts/firebase/firebase-targets.mjs";
            assertFirebaseDeploymentTarget({
              targetName: process.env.FIREBASE_TARGET,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
              databaseId: process.env.FIREBASE_DATABASE_ID,
            });
          '
      - name: Install pinned Firebase CLI
        id: install_cli
        timeout-minutes: 5
        run: npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Configure scoped staging credentials
        id: configure_credentials
        timeout-minutes: 2
        env:
          FIREBASE_STAGING_RULES_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_STAGING_RULES_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$FIREBASE_STAGING_RULES_SERVICE_ACCOUNT_JSON" ]]
          umask 077
          credentials_file="${RUNNER_TEMP}/firebase-staging-service-account.json"
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          mkdir -p "$evidence_dir"
          printf '%s' "$FIREBASE_STAGING_RULES_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          CREDENTIALS_PATH="$credentials_file" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const credentials = JSON.parse(readFileSync(process.env.CREDENTIALS_PATH, "utf8"));
            if (credentials.type !== "service_account") {
              throw new Error("Staging Rules credential is not a service-account key.");
            }
            if (credentials.project_id !== process.env.FIREBASE_PROJECT_ID) {
              throw new Error("Staging credential project differs.");
            }
            const expectedEmail = "tenacity-staging-rules@tenacity-tutoring-staging.iam.gserviceaccount.com";
            if (credentials.client_email !== expectedEmail) {
              throw new Error("Staging Rules credential identity differs.");
            }
            if (
              typeof credentials.private_key !== "string" ||
              !credentials.private_key.includes("-----BEGIN PRIVATE KEY-----") ||
              !credentials.private_key.includes("-----END PRIVATE KEY-----")
            ) {
              throw new Error("Staging Rules credential private key is invalid.");
            }
          '
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"
      - name: Record the selected staging scenario
        id: record_scenario
        timeout-minutes: 1
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          REPORT_PATH="${RUNNER_TEMP}/firebase-rules-staging-evidence/scenario.json" \
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              writeFileSync(process.env.REPORT_PATH, `${JSON.stringify({
                scenario: process.env.SCENARIO,
                target: process.env.FIREBASE_TARGET,
                projectId: process.env.FIREBASE_PROJECT_ID,
                gitSha: process.env.GITHUB_SHA,
              }, null, 2)}\n`, { mode: 0o600 });
            '
      - name: Capture or record initial staging Rules state
        id: capture_before_rules
        timeout-minutes: 5
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          if [[ "$SCENARIO" == "bootstrap" ]]; then
            RULES_BEFORE_PATH="${evidence_dir}/rules-before.json" \
              node --input-type=module -e '
                import { readFileSync, writeFileSync } from "node:fs";
                import {
                  authorizedJsonRequest,
                  getAccessToken,
                } from "./scripts/firebase/google-api.mjs";

                const serviceAccount = JSON.parse(
                  readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8")
                );
                const accessToken = await getAccessToken({
                  serviceAccount,
                  scopes: ["https://www.googleapis.com/auth/firebase.readonly"],
                });
                const project = encodeURIComponent(process.env.FIREBASE_PROJECT_ID);
                const payload = await authorizedJsonRequest(
                  `https://firebaserules.googleapis.com/v1/projects/${project}/releases?pageSize=100`,
                  { accessToken }
                );
                if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
                  throw new Error("Initial Rules release-list response is invalid.");
                }
                const keys = Object.keys(payload).sort();
                if (keys.some((key) => key !== "releases")) {
                  throw new Error("Initial Rules release-list response has unexpected fields.");
                }
                if (payload.releases !== undefined && !Array.isArray(payload.releases)) {
                  throw new Error("Initial Rules releases field is invalid.");
                }
                const releases = payload.releases ?? [];
                if (!Array.isArray(releases) || releases.length !== 0) {
                  throw new Error("Bootstrap requires an empty initial Rules release list.");
                }
                writeFileSync(process.env.RULES_BEFORE_PATH, `${JSON.stringify({
                  kind: "tenacity.firebase-rules-release-inventory",
                  schemaVersion: 1,
                  targetName: process.env.FIREBASE_TARGET,
                  projectId: process.env.FIREBASE_PROJECT_ID,
                  storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
                  databaseId: process.env.FIREBASE_DATABASE_ID,
                  capturedAt: new Date().toISOString(),
                  releases: [],
                }, null, 2)}\n`, { mode: 0o600 });
              '
          else
            node scripts/firebase/firebase-rules-state.mjs capture \
              --target "$FIREBASE_TARGET" \
              --project "$FIREBASE_PROJECT_ID" \
              --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
              --output "${evidence_dir}/rules-before.json"
          fi
      - name: Assess the captured staging Rules state
        id: assess_before_rules
        timeout-minutes: 3
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          if [[ "$SCENARIO" == "noop" || "$SCENARIO" == "partial" ]]; then
            node scripts/firebase/firebase-rules-state.mjs verify \
              --target "$FIREBASE_TARGET" \
              --project "$FIREBASE_PROJECT_ID" \
              --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
              --snapshot "${evidence_dir}/rules-before.json" \
              > "${evidence_dir}/rules-before-assessment.json"
          else
            SNAPSHOT_PATH="${evidence_dir}/rules-before.json" \
            REPORT_PATH="${evidence_dir}/rules-before-assessment.json" \
              node --input-type=module -e '
                import { readFileSync, writeFileSync } from "node:fs";
                const snapshot = JSON.parse(readFileSync(process.env.SNAPSHOT_PATH, "utf8"));
                const expectedKeys = [
                  "capturedAt",
                  "databaseId",
                  "kind",
                  "projectId",
                  "releases",
                  "schemaVersion",
                  "storageBucket",
                  "targetName",
                ];
                if (JSON.stringify(Object.keys(snapshot).sort()) !== JSON.stringify(expectedKeys)) {
                  throw new Error("Bootstrap initial-state record has unexpected or missing fields.");
                }
                if (snapshot.kind !== "tenacity.firebase-rules-release-inventory") {
                  throw new Error("Bootstrap initial-state record kind differs.");
                }
                if (snapshot.schemaVersion !== 1 || snapshot.targetName !== process.env.FIREBASE_TARGET) {
                  throw new Error("Bootstrap initial-state target metadata differs.");
                }
                if (snapshot.projectId !== process.env.FIREBASE_PROJECT_ID) {
                  throw new Error("Bootstrap snapshot project differs.");
                }
                if (snapshot.storageBucket !== process.env.FIREBASE_STORAGE_BUCKET) {
                  throw new Error("Bootstrap snapshot bucket differs.");
                }
                if (snapshot.databaseId !== process.env.FIREBASE_DATABASE_ID) {
                  throw new Error("Bootstrap snapshot database differs.");
                }
                if (!Array.isArray(snapshot.releases) || snapshot.releases.length !== 0) {
                  throw new Error("Bootstrap initial release list is not empty.");
                }
                writeFileSync(process.env.REPORT_PATH, `${JSON.stringify({
                  scenario: "bootstrap",
                  initialReleaseState: "absent",
                  safeToBootstrap: true,
                }, null, 2)}\n`, { mode: 0o600 });
              '
          fi
      - name: Prepare the exact partial Rules deployment
        id: prepare_partial_rules
        if: inputs.scenario == 'partial'
        timeout-minutes: 3
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          FIXTURE_PATH="backend/firebase/rules/staging/firestore-deny-all.rules" \
          PRIOR_SNAPSHOT_PATH="${evidence_dir}/rules-before.json" \
          PARTIAL_CONFIG_PATH="${evidence_dir}/firebase-partial-rules.json" \
          PARTIAL_INPUTS_PATH="${evidence_dir}/partial-inputs.json" \
            node --input-type=module -e '
              import { createHash } from "node:crypto";
              import { readFileSync, writeFileSync } from "node:fs";
              import { resolve } from "node:path";

              const sha256 = (value) => createHash("sha256").update(value).digest("hex");
              const fixturePath = resolve(process.env.FIXTURE_PATH);
              const fixture = readFileSync(fixturePath, "utf8");
              if (sha256(fixture) !== process.env.PARTIAL_RULES_FIXTURE_SHA256) {
                throw new Error("Partial Rules fixture digest differs from the reviewed value.");
              }
              const allowStatements = [
                ...fixture.matchAll(/\ballow\s+([^:;]+):\s*if\s+([^;]+);/g),
              ];
              if (
                allowStatements.length !== 1 ||
                allowStatements[0][1].trim() !== "read, write" ||
                allowStatements[0][2].trim() !== "false" ||
                (fixture.match(/\ballow\b/g) ?? []).length !== 1
              ) {
                throw new Error("Partial Rules fixture is not the reviewed literal deny-all source.");
              }
              const prior = JSON.parse(
                readFileSync(process.env.PRIOR_SNAPSHOT_PATH, "utf8")
              );
              if (!/^[0-9a-f]{64}$/.test(prior.snapshotDigestSha256)) {
                throw new Error("Prior Rules snapshot digest is invalid.");
              }
              const partialConfig = {
                firestore: {
                  rules: fixturePath,
                },
              };
              const partialConfigContent = `${JSON.stringify(partialConfig, null, 2)}\n`;
              writeFileSync(process.env.PARTIAL_CONFIG_PATH, partialConfigContent, {
                encoding: "utf8",
                flag: "wx",
                mode: 0o600,
              });
              writeFileSync(process.env.PARTIAL_INPUTS_PATH, `${JSON.stringify({
                scenario: "partial",
                targetName: process.env.FIREBASE_TARGET,
                projectId: process.env.FIREBASE_PROJECT_ID,
                storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
                databaseId: process.env.FIREBASE_DATABASE_ID,
                gitSha: process.env.GITHUB_SHA,
                confirmation: process.env.CONFIRMATION,
                fixturePath: process.env.FIXTURE_PATH,
                fixtureSha256: process.env.PARTIAL_RULES_FIXTURE_SHA256,
                partialConfigSha256: sha256(partialConfigContent),
                priorSnapshotDigestSha256: prior.snapshotDigestSha256,
              }, null, 2)}\n`, {
                encoding: "utf8",
                flag: "wx",
                mode: 0o600,
              });
            '
      - name: Run staging Rules deployment dry run
        id: dry_run_rules
        timeout-minutes: 8
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          deploy_args=(
            --config firebase.json
            --project "$FIREBASE_PROJECT_ID"
            --only "firestore:rules,storage:${FIREBASE_STORAGE_TARGET}"
          )
          if [[ "$SCENARIO" == "partial" ]]; then
            deploy_args=(
              --config "${RUNNER_TEMP}/firebase-rules-staging-evidence/firebase-partial-rules.json"
              --project "$FIREBASE_PROJECT_ID"
              --only firestore:rules
            )
          fi
          firebase deploy "${deploy_args[@]}" \
            --dry-run \
            --non-interactive
      - name: Deploy selected Rules scenario to staging
        id: deploy_rules
        timeout-minutes: 10
        continue-on-error: true
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          deploy_args=(
            --config firebase.json
            --project "$FIREBASE_PROJECT_ID"
            --only "firestore:rules,storage:${FIREBASE_STORAGE_TARGET}"
          )
          if [[ "$SCENARIO" == "partial" ]]; then
            deploy_args=(
              --config "${evidence_dir}/firebase-partial-rules.json"
              --project "$FIREBASE_PROJECT_ID"
              --only firestore:rules
            )
          fi
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          firebase deploy "${deploy_args[@]}" \
            --non-interactive \
            2>&1 | tee "${evidence_dir}/rules-deploy.log"
          deploy_exit_code="${PIPESTATUS[0]}"
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"exitCode":%s,"startedAt":"%s","finishedAt":"%s"}\n' \
            "$deploy_exit_code" "$started_at" "$finished_at" \
            > "${evidence_dir}/rules-deploy-status.json"
          exit "$deploy_exit_code"
      - name: Capture staging Rules after the attempted deployment
        id: capture_after_rules
        if: always()
        timeout-minutes: 5
        run: |
          node scripts/firebase/firebase-rules-state.mjs capture \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --output "${RUNNER_TEMP}/firebase-rules-staging-evidence/rules-after.json"
      - name: Verify staging Rules after rehearsal
        id: verify_after_rules
        if: always() && steps.capture_after_rules.outcome == 'success'
        timeout-minutes: 3
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          if [[ "$SCENARIO" == "partial" ]]; then
            BEFORE_SNAPSHOT="${evidence_dir}/rules-before.json" \
            AFTER_SNAPSHOT="${evidence_dir}/rules-after.json" \
            FIXTURE_PATH="backend/firebase/rules/staging/firestore-deny-all.rules" \
            REPORT_PATH="${evidence_dir}/rules-after-verification.json" \
              node --input-type=module -e '
                import { createHash } from "node:crypto";
                import { readFileSync, writeFileSync } from "node:fs";

                const before = JSON.parse(readFileSync(process.env.BEFORE_SNAPSHOT, "utf8"));
                const after = JSON.parse(readFileSync(process.env.AFTER_SNAPSHOT, "utf8"));
                const fixture = readFileSync(process.env.FIXTURE_PATH, "utf8");
                const fixtureSha256 = createHash("sha256").update(fixture).digest("hex");
                if (fixtureSha256 !== process.env.PARTIAL_RULES_FIXTURE_SHA256) {
                  throw new Error("Partial Rules fixture digest differs during read-back.");
                }
                const beforeFirestore = before.releases?.firestore;
                const afterFirestore = after.releases?.firestore;
                const beforeStorage = before.releases?.storage;
                const afterStorage = after.releases?.storage;
                if (!beforeFirestore || !afterFirestore || !beforeStorage || !afterStorage) {
                  throw new Error("Partial Rules read-back is missing a Rules surface.");
                }
                if (
                  beforeFirestore.release.rulesetName ===
                  afterFirestore.release.rulesetName
                ) {
                  throw new Error("Partial Rules deployment did not move the Firestore pointer.");
                }
                const firestoreFiles = afterFirestore.ruleset.source?.files ?? [];
                if (firestoreFiles.length !== 1 || firestoreFiles[0].content !== fixture) {
                  throw new Error("Partial Firestore Rules source differs from the exact fixture.");
                }
                if (beforeStorage.release.rulesetName !== afterStorage.release.rulesetName) {
                  throw new Error("Partial Rules deployment moved the Storage pointer.");
                }
                const immutableFiles = (entry) =>
                  (entry.ruleset.source?.files ?? [])
                    .map(({ name, content }) => ({ name, content }))
                    .sort((left, right) => left.name.localeCompare(right.name));
                if (
                  beforeStorage.ruleset.name !== afterStorage.ruleset.name ||
                  JSON.stringify(immutableFiles(beforeStorage)) !==
                    JSON.stringify(immutableFiles(afterStorage))
                ) {
                  throw new Error("Partial Rules deployment changed immutable Storage name or content.");
                }
                writeFileSync(process.env.REPORT_PATH, `${JSON.stringify({
                  scenario: "partial",
                  fixtureSha256,
                  firestoreRulesetBefore: beforeFirestore.release.rulesetName,
                  firestoreRulesetAfter: afterFirestore.release.rulesetName,
                  storageRulesetUnchanged: afterStorage.release.rulesetName,
                }, null, 2)}\n`, { mode: 0o600 });
              '
          else
            node scripts/firebase/firebase-rules-state.mjs verify \
              --target "$FIREBASE_TARGET" \
              --project "$FIREBASE_PROJECT_ID" \
              --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
              --snapshot "${evidence_dir}/rules-after.json" \
              > "${evidence_dir}/rules-after-verification.json"
          fi
      - name: Run read-only staging rollback preflight
        id: rollback_preflight
        if: always() && steps.capture_after_rules.outcome == 'success'
        timeout-minutes: 5
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          if [[ "$SCENARIO" == "bootstrap" ]]; then
            REPORT_PATH="${evidence_dir}/rules-rollback-preflight.json" \
              node --input-type=module -e '
                import { writeFileSync } from "node:fs";
                writeFileSync(process.env.REPORT_PATH, `${JSON.stringify({
                  scenario: "bootstrap",
                  applicable: false,
                  reason: "No prior Rules releases exist to restore.",
                }, null, 2)}\n`, { mode: 0o600 });
              '
          else
            node scripts/firebase/firebase-rules-state.mjs rollback \
              --target "$FIREBASE_TARGET" \
              --project "$FIREBASE_PROJECT_ID" \
              --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
              --prior-snapshot "${evidence_dir}/rules-before.json" \
              --current-snapshot "${evidence_dir}/rules-after.json" \
              > "${evidence_dir}/rules-rollback-preflight.json"
          fi
      - name: Create required staging Rules evidence manifest
        id: evidence_manifest
        if: always()
        timeout-minutes: 2
        env:
          TARGET_GATE_OUTCOME: ${{ steps.target_gate.outcome }}
          SCENARIO_OUTCOME: ${{ steps.record_scenario.outcome }}
          CAPTURE_BEFORE_OUTCOME: ${{ steps.capture_before_rules.outcome }}
          ASSESS_BEFORE_OUTCOME: ${{ steps.assess_before_rules.outcome }}
          PREPARE_PARTIAL_OUTCOME: ${{ steps.prepare_partial_rules.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run_rules.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_rules.outcome }}
          CAPTURE_AFTER_OUTCOME: ${{ steps.capture_after_rules.outcome }}
          VERIFY_AFTER_OUTCOME: ${{ steps.verify_after_rules.outcome }}
          ROLLBACK_PREFLIGHT_OUTCOME: ${{ steps.rollback_preflight.outcome }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          partial_files=()
          if [[ "$SCENARIO" == "partial" ]]; then
            partial_files+=(
              --file "partialConfig=${evidence_dir}/firebase-partial-rules.json"
              --file "partialInputs=${evidence_dir}/partial-inputs.json"
            )
          fi
          node scripts/firebase/deployment-evidence-manifest.mjs create \
            --type firebase-rules-staging-rehearsal \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --job rehearse \
            --outcome "targetGate=${TARGET_GATE_OUTCOME:-unknown}" \
            --outcome "scenario=${SCENARIO_OUTCOME:-unknown}" \
            --outcome "captureBefore=${CAPTURE_BEFORE_OUTCOME:-unknown}" \
            --outcome "assessBefore=${ASSESS_BEFORE_OUTCOME:-unknown}" \
            --outcome "preparePartial=${PREPARE_PARTIAL_OUTCOME:-unknown}" \
            --outcome "dryRun=${DRY_RUN_OUTCOME:-unknown}" \
            --outcome "deploy=${DEPLOY_OUTCOME:-unknown}" \
            --outcome "captureAfter=${CAPTURE_AFTER_OUTCOME:-unknown}" \
            --outcome "verifyAfter=${VERIFY_AFTER_OUTCOME:-unknown}" \
            --outcome "rollbackPreflight=${ROLLBACK_PREFLIGHT_OUTCOME:-unknown}" \
            --file "scenario=${evidence_dir}/scenario.json" \
            --file "rulesBefore=${evidence_dir}/rules-before.json" \
            --file "rulesBeforeAssessment=${evidence_dir}/rules-before-assessment.json" \
            --file "deployLog=${evidence_dir}/rules-deploy.log" \
            --file "deployStatus=${evidence_dir}/rules-deploy-status.json" \
            --file "rulesAfter=${evidence_dir}/rules-after.json" \
            --file "rulesAfterVerification=${evidence_dir}/rules-after-verification.json" \
            --file "rollbackPreflight=${evidence_dir}/rules-rollback-preflight.json" \
            "${partial_files[@]}" \
            --output "${evidence_dir}/evidence-manifest.json"
      - name: Require complete staging Rules evidence
        id: verify_evidence_manifest
        if: always()
        timeout-minutes: 2
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-staging-evidence"
          partial_requirements=(--require-outcome preparePartial=skipped)
          if [[ "$SCENARIO" == "partial" ]]; then
            partial_requirements=(
              --require-file partialConfig
              --require-file partialInputs
              --require-outcome preparePartial=success
            )
          fi
          node scripts/firebase/deployment-evidence-manifest.mjs verify \
            --manifest "${evidence_dir}/evidence-manifest.json" \
            --artifact-directory "$evidence_dir" \
            --type firebase-rules-staging-rehearsal \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --require-file scenario \
            --require-file rulesBefore \
            --require-file rulesBeforeAssessment \
            --require-file deployLog \
            --require-file deployStatus \
            --require-file rulesAfter \
            --require-file rulesAfterVerification \
            --require-file rollbackPreflight \
            --require-outcome targetGate=success \
            --require-outcome scenario=success \
            --require-outcome captureBefore=success \
            --require-outcome assessBefore=success \
            --require-outcome dryRun=success \
            --require-outcome deploy=success \
            --require-outcome captureAfter=success \
            --require-outcome verifyAfter=success \
            --require-outcome rollbackPreflight=success \
            "${partial_requirements[@]}" \
            > "${evidence_dir}/evidence-manifest-verification.json"
      - name: Upload staging Rules evidence
        id: upload_evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-rules-staging-rehearsal-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firebase-rules-staging-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary staging credentials
        id: cleanup_credentials
        if: always()
        timeout-minutes: 1
        run: rm -f "${RUNNER_TEMP}/firebase-staging-service-account.json"
      - name: Reject any failed rehearsal or evidence step
        if: always()
        timeout-minutes: 1
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_rules.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify_evidence_manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          [[ "$DEPLOY_OUTCOME" == "success" ]]
          [[ "$EVIDENCE_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]
