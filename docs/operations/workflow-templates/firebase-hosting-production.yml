# INERT TEMPLATE: GitHub does not discover workflows outside .github/workflows.
# Do not copy this file into .github/workflows until every activation gate in
# docs/operations/production-deployment-controls.md is satisfied.
name: Deploy admin portal Hosting to production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch commit SHA approved for deployment
        required: true
        type: string
      confirmation:
        description: Type DEPLOY HOSTING tenacity-tutoring-b8eb2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tenacity-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TOOLS_VERSION: 15.20.0
  FIREBASE_PROJECT_ID: tenacity-tutoring-b8eb2
  FIREBASE_HOSTING_SITE: tenacity-tutoring-b8eb2
  FIREBASE_HOSTING_TARGET: admin-portal

jobs:
  validate:
    name: Validate exact portal source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Reject an unapproved ref or confirmation
        env:
          APPROVED_SHA: ${{ inputs.git_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$APPROVED_SHA" ]]
          [[ "$CONFIRMATION" == "DEPLOY HOSTING tenacity-tutoring-b8eb2" ]]
      - name: Check out approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json
      - name: Install exact dependencies
        run: npm ci --prefix apps/admin-portal
      - name: Test and build without production credentials
        run: |
          node scripts/ci/validate-firebase-config.mjs
          npm --prefix apps/admin-portal test
          node --test apps/admin-portal/test/enrolmentEditPayload.test.mjs
          npm --prefix apps/admin-portal run build

  deploy:
    name: Stage, smoke-test, and promote approved portal
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: tenacity-production
    steps:
      - name: Verify the production environment is armed
        env:
          DEPLOYS_ENABLED: ${{ vars.TENACITY_PRODUCTION_DEPLOYS_ENABLED }}
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          CONFIGURED_TARGET: ${{ vars.FIREBASE_HOSTING_TARGET }}
        run: |
          [[ "$DEPLOYS_ENABLED" == "true" ]]
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_SITE" == "$FIREBASE_HOSTING_SITE" ]]
          [[ "$CONFIGURED_TARGET" == "$FIREBASE_HOSTING_TARGET" ]]
      - name: Check out approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json
      - name: Install exact dependencies
        run: |
          npm ci --prefix apps/admin-portal
          npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Recheck approved SHA after environment approval
        env:
          APPROVED_SHA: ${{ inputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$APPROVED_SHA" ]]
      - name: Configure scoped Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]
          umask 077
          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"
      - name: Build portal with approved production client configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          [[ -n "$VITE_FIREBASE_API_KEY" ]]
          [[ -n "$VITE_FIREBASE_AUTH_DOMAIN" ]]
          [[ "$VITE_FIREBASE_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ -n "$VITE_FIREBASE_STORAGE_BUCKET" ]]
          [[ -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" ]]
          [[ -n "$VITE_FIREBASE_APP_ID" ]]
          npm --prefix apps/admin-portal run build
      - name: Capture current live channel and stage preview
        env:
          APPROVED_SHA: ${{ inputs.git_sha }}
        run: |
          reports_dir="${RUNNER_TEMP}/hosting-deploy-reports"
          mkdir -p "$reports_dir"
          channel_id="cutover-${APPROVED_SHA:0:12}-${GITHUB_RUN_ATTEMPT}"
          echo "CHANNEL_ID=$channel_id" >> "$GITHUB_ENV"
          firebase hosting:channel:list \
            --site "$FIREBASE_HOSTING_SITE" \
            --project "$FIREBASE_PROJECT_ID" \
            --json > "$reports_dir/channels-before.json"
          firebase hosting:channel:deploy "$channel_id" \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --only "$FIREBASE_HOSTING_TARGET" \
            --expires 1d \
            --no-authorized-domains \
            --non-interactive \
            --json > "$reports_dir/preview.json"
          preview_url="$(node -e 'const fs=require("fs");const root=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const queue=[root];while(queue.length){const value=queue.shift();if(value&&typeof value==="object"){if(typeof value.url==="string"){process.stdout.write(value.url);process.exit(0)}queue.push(...Object.values(value));}}process.exit(1);' "$reports_dir/preview.json")"
          [[ "$preview_url" == https://* ]]
          printf '%s\n' "$preview_url" > "$reports_dir/preview-url.txt"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
      - name: Smoke-test the public preview without mutations
        run: |
          for path in / /terms.html /reset_password.html; do
            curl --fail --silent --show-error --location "${PREVIEW_URL}${path}" > /dev/null
          done
      - name: Promote the exact preview version to live
        run: |
          firebase hosting:clone \
            "${FIREBASE_HOSTING_SITE}:${CHANNEL_ID}" \
            "${FIREBASE_HOSTING_SITE}:live" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          firebase hosting:channel:list \
            --site "$FIREBASE_HOSTING_SITE" \
            --project "$FIREBASE_PROJECT_ID" \
            --json > "${RUNNER_TEMP}/hosting-deploy-reports/channels-after.json"
      - name: Smoke-test live static routes
        run: |
          for origin in \
            "https://${FIREBASE_HOSTING_SITE}.web.app" \
            "https://admin.tenacitytutoring.com"; do
            for path in / /terms.html /reset_password.html; do
              curl --fail --silent --show-error --location "${origin}${path}" > /dev/null
            done
          done
      - name: Upload Hosting deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-hosting-deployment-evidence
          path: ${{ runner.temp }}/hosting-deploy-reports
          if-no-files-found: warn
          retention-days: 90
      - name: Remove temporary credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/firebase-service-account.json"
