# ACTIVE PRODUCTION WORKFLOW: manual dispatch only. Execution requires the
# protected tenacity-production environment, per
# docs/operations/production-deployment-controls.md.
name: Deploy Firestore indexes to production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch commit SHA authorized for deployment
        required: true
        type: string
      confirmation:
        description: Type DEPLOY INDEXES tenacity-tutoring-b8eb2
        required: true
        type: string

  workflow_call:
    inputs:
      git_sha:
        required: true
        type: string
      confirmation:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tenacity-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TOOLS_VERSION: 15.20.0
  FIREBASE_TARGET: production
  FIREBASE_PROJECT_ID: tenacity-tutoring-b8eb2
  FIREBASE_STORAGE_BUCKET: tenacity-tutoring-b8eb2.firebasestorage.app
  FIREBASE_DATABASE_ID: (default)

jobs:
  validate:
    name: Validate exact index source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject an unauthorized ref or confirmation
        timeout-minutes: 1
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$AUTHORIZED_SHA" ]]
          [[ "$CONFIRMATION" == "DEPLOY INDEXES tenacity-tutoring-b8eb2" ]]
      - name: Check out authorized commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate manifest and reviewed source hash
        timeout-minutes: 5
        run: node scripts/ci/validate-firebase-config.mjs

  open-record:
    name: Open deploy record
    needs: validate
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Indexes
      git_sha: ${{ inputs.git_sha }}
      action: open

  deploy:
    name: Authorized index deployment
    needs: [validate, open-record]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: tenacity-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out authorized commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Recheck authorized SHA after environment gate
        id: recheck_sha
        timeout-minutes: 2
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$AUTHORIZED_SHA" ]]
      - name: Verify the reviewed target constants
        id: arm_target
        timeout-minutes: 2
        env:
          CONFIGURED_TARGET: ${{ vars.FIREBASE_DEPLOYMENT_TARGET }}
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          CONFIGURED_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
        run: |
          [[ "$CONFIGURED_TARGET" == "$FIREBASE_TARGET" ]]
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_STORAGE_BUCKET" == "$FIREBASE_STORAGE_BUCKET" ]]
          [[ "$CONFIGURED_DATABASE_ID" == "$FIREBASE_DATABASE_ID" ]]
          node --input-type=module -e '
            import { assertFirebaseDeploymentTarget } from "./scripts/firebase/firebase-targets.mjs";
            assertFirebaseDeploymentTarget({
              targetName: process.env.FIREBASE_TARGET,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
              databaseId: process.env.FIREBASE_DATABASE_ID,
            });
          '
      - name: Install pinned Firebase CLI
        id: install_cli
        timeout-minutes: 5
        run: npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Prepare the deployment evidence directory
        id: prepare_evidence_dir
        timeout-minutes: 1
        run: mkdir -p "${RUNNER_TEMP}/firebase-index-evidence"
      - name: Authenticate the scoped production index identity via federation
        id: configure_credentials
        timeout-minutes: 2
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/398065992407/locations/global/workloadIdentityPools/github/providers/tenacity-platform
          service_account: tenacity-production-indexes@tenacity-tutoring-b8eb2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
      - name: Capture live indexes before deployment
        id: capture_before_indexes
        timeout-minutes: 6
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.configure_credentials.outputs.access_token }}
        run: |
          node scripts/firebase/firestore-index-state.mjs capture \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --database "$FIREBASE_DATABASE_ID" \
            --output "${RUNNER_TEMP}/firebase-index-evidence/indexes-before.json"
      - name: Require an empty live-to-source index diff
        id: verify_before_indexes
        timeout-minutes: 4
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.configure_credentials.outputs.access_token }}
        run: |
          node scripts/firebase/firestore-index-state.mjs verify \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --database "$FIREBASE_DATABASE_ID" \
            --snapshot "${RUNNER_TEMP}/firebase-index-evidence/indexes-before.json" \
            --source backend/firebase/indexes/firestore.indexes.json \
            --policy backend/firebase/inventory/pending-index-deployment-exceptions.json \
            --allow-pending-additions true \
            --report "${RUNNER_TEMP}/firebase-index-evidence/indexes-before-verification.json"
      - name: Privileged deployment dry run
        id: dry_run_indexes
        timeout-minutes: 8
        run: |
          firebase deploy \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:indexes \
            --dry-run \
            --non-interactive
      - name: Deploy reviewed indexes
        id: deploy_indexes
        timeout-minutes: 10
        continue-on-error: true
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-evidence"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          firebase deploy \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --only firestore:indexes \
            --non-interactive \
            2>&1 | tee "${evidence_dir}/indexes-deploy.log"
          deploy_exit_code="${PIPESTATUS[0]}"
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"exitCode":%s,"startedAt":"%s","finishedAt":"%s"}\n' \
            "$deploy_exit_code" "$started_at" "$finished_at" \
            > "${evidence_dir}/indexes-deploy-status.json"
          exit "$deploy_exit_code"
      - name: Capture live indexes after deployment
        id: capture_after_indexes
        if: always() && steps.deploy_indexes.outcome != 'skipped'
        # A freshly deployed composite index build is asynchronous — capture
        # rejects anything still CREATING, and a real index over the current
        # data can take a long time to finish. Retries every 30s for up to
        # 90 minutes, mirroring the same loop firebase-indexes-staging-
        # rehearsal.yml already uses for exactly this reason. When nothing
        # new was deployed (deploy_indexes failed or was a no-op), every
        # existing index is already READY, so this succeeds on the first
        # attempt and costs nothing.
        timeout-minutes: 95
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.configure_credentials.outputs.access_token }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-evidence"
          candidate="${evidence_dir}/indexes-after-candidate.json"
          output="${evidence_dir}/indexes-after.json"
          for attempt in $(seq 1 180); do
            rm -f "$candidate"
            if node scripts/firebase/firestore-index-state.mjs capture \
              --target "$FIREBASE_TARGET" \
              --project "$FIREBASE_PROJECT_ID" \
              --database "$FIREBASE_DATABASE_ID" \
              --output "$candidate"; then
              mv "$candidate" "$output"
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Check source equality and retained index resources
        id: verify_after_indexes
        if: always() && steps.deploy_indexes.outcome != 'skipped'
        timeout-minutes: 4
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.configure_credentials.outputs.access_token }}
        run: |
          node scripts/firebase/firestore-index-state.mjs verify \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --database "$FIREBASE_DATABASE_ID" \
            --snapshot "${RUNNER_TEMP}/firebase-index-evidence/indexes-after.json" \
            --source backend/firebase/indexes/firestore.indexes.json \
            --baseline "${RUNNER_TEMP}/firebase-index-evidence/indexes-before.json" \
            --policy backend/firebase/inventory/pending-index-deployment-exceptions.json \
            --report "${RUNNER_TEMP}/firebase-index-evidence/indexes-after-verification.json"
      - name: Create required index evidence manifest
        id: evidence_manifest
        if: always()
        timeout-minutes: 2
        env:
          ARMED_OUTCOME: ${{ steps.arm_target.outcome }}
          DRY_RUN_OUTCOME: ${{ steps.dry_run_indexes.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_indexes.outcome }}
          CAPTURE_BEFORE_OUTCOME: ${{ steps.capture_before_indexes.outcome }}
          VERIFY_BEFORE_OUTCOME: ${{ steps.verify_before_indexes.outcome }}
          CAPTURE_AFTER_OUTCOME: ${{ steps.capture_after_indexes.outcome }}
          VERIFY_AFTER_OUTCOME: ${{ steps.verify_after_indexes.outcome }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-evidence"
          node scripts/firebase/deployment-evidence-manifest.mjs create \
            --type firebase-index-deployment \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --job deploy \
            --outcome "armed=${ARMED_OUTCOME:-unknown}" \
            --outcome "captureBefore=${CAPTURE_BEFORE_OUTCOME:-unknown}" \
            --outcome "verifyBefore=${VERIFY_BEFORE_OUTCOME:-unknown}" \
            --outcome "dryRun=${DRY_RUN_OUTCOME:-unknown}" \
            --outcome "deploy=${DEPLOY_OUTCOME:-unknown}" \
            --outcome "captureAfter=${CAPTURE_AFTER_OUTCOME:-unknown}" \
            --outcome "verifyAfter=${VERIFY_AFTER_OUTCOME:-unknown}" \
            --file "indexesBefore=${evidence_dir}/indexes-before.json" \
            --file "indexesBeforeVerification=${evidence_dir}/indexes-before-verification.json" \
            --file "deployLog=${evidence_dir}/indexes-deploy.log" \
            --file "deployStatus=${evidence_dir}/indexes-deploy-status.json" \
            --file "indexesAfter=${evidence_dir}/indexes-after.json" \
            --file "indexesAfterVerification=${evidence_dir}/indexes-after-verification.json" \
            --output "${evidence_dir}/evidence-manifest.json"
      - name: Require complete index deployment evidence
        id: verify_evidence_manifest
        if: always()
        timeout-minutes: 2
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-index-evidence"
          node scripts/firebase/deployment-evidence-manifest.mjs verify \
            --manifest "${evidence_dir}/evidence-manifest.json" \
            --artifact-directory "$evidence_dir" \
            --type firebase-index-deployment \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --require-file indexesBefore \
            --require-file indexesBeforeVerification \
            --require-file deployLog \
            --require-file deployStatus \
            --require-file indexesAfter \
            --require-file indexesAfterVerification \
            --require-outcome armed=success \
            --require-outcome captureBefore=success \
            --require-outcome verifyBefore=success \
            --require-outcome dryRun=success \
            --require-outcome deploy=success \
            --require-outcome captureAfter=success \
            --require-outcome verifyAfter=success \
            > "${evidence_dir}/evidence-manifest-verification.json"
      - name: Upload index deployment evidence
        id: upload_evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-index-deployment-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firebase-index-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary credentials
        id: cleanup_credentials
        if: always()
        timeout-minutes: 1
        run: |
          if [[ -n "${GOOGLE_GHA_CREDS_PATH:-}" ]]; then
            rm -f "$GOOGLE_GHA_CREDS_PATH"
          fi
      - name: Reject any failed deployment or evidence step
        if: always()
        timeout-minutes: 1
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_indexes.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify_evidence_manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          [[ "$DEPLOY_OUTCOME" == "success" ]]
          [[ "$EVIDENCE_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]

  close-record:
    name: Close deploy record
    needs: [open-record, deploy]
    if: always() && needs.open-record.result == 'success'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Indexes
      git_sha: ${{ inputs.git_sha }}
      action: close
      outcome: ${{ needs.deploy.result }}
