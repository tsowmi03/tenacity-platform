# Keep staging's term calendar aligned with production without exporting users,
# classes or attendance. The two jobs use separate read and write identities.
name: Sync production term calendar to staging

on:
  schedule:
    # 00:35 Sydney in AEST, 01:35 in AEDT. Runs after daily term rollover.
    - cron: "35 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/firebase-terms-staging-sync.yml
      - backend/firebase/functions/scripts/syncStagingTerms.js

permissions:
  contents: read

concurrency:
  group: tenacity-staging-terms
  cancel-in-progress: false

jobs:
  export:
    name: Read production calendar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: tenacity-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - run: npm ci --prefix backend/firebase/functions
      - name: Authenticate production term reader
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/398065992407/locations/global/workloadIdentityPools/github/providers/tenacity-platform
          service_account: tenacity-prod-term-read@tenacity-tutoring-b8eb2.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Export calendar fields
        env:
          GOOGLE_CLOUD_PROJECT: tenacity-tutoring-b8eb2
          GCLOUD_PROJECT: tenacity-tutoring-b8eb2
        run: node backend/firebase/functions/scripts/syncStagingTerms.js export --out="$RUNNER_TEMP/term-calendar.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: term-calendar
          path: ${{ runner.temp }}/term-calendar.json
          retention-days: 1
          if-no-files-found: error

  sync:
    name: Apply calendar to staging
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: tenacity-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - run: npm ci --prefix backend/firebase/functions
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: term-calendar
          path: ${{ runner.temp }}
      - name: Authenticate staging term writer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/354428033510/locations/global/workloadIdentityPools/github/providers/tenacity-platform
          service_account: tenacity-stage-term-write@tenacity-tutoring-staging.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Sync and verify staging terms
        env:
          GOOGLE_CLOUD_PROJECT: tenacity-tutoring-staging
          GCLOUD_PROJECT: tenacity-tutoring-staging
        run: node backend/firebase/functions/scripts/syncStagingTerms.js sync --source="$RUNNER_TEMP/term-calendar.json"
