# ACTIVE READ-ONLY WORKFLOW: reports whether the rules deployed to a project
# still match the repository. It reads the Rules API and nothing else - no
# deploy, no mutation, no Firebase CLI - so it runs unattended on a schedule
# and after every merge that touches rules.
#
# It deliberately does not consult TENACITY_STAGING_REHEARSALS_ENABLED. That
# flag is off between rehearsal windows, which is correct for a workflow that
# can change staging and exactly wrong for one that watches it: drift matters
# most in the weeks when nobody is running rehearsals. See TP-19.
name: Check Firebase rules drift

on:
  schedule:
    # 05:15 Sydney in AEST, 06:15 in AEDT - GitHub cron is UTC and does not
    # follow daylight saving, so this is early enough in either offset.
    - cron: "15 19 * * *"
  push:
    branches:
      - main
    paths:
      - backend/firebase/rules/**
      - firebase.json
      - scripts/firebase/firebase-rules-drift.mjs
      - scripts/firebase/firebase-rules-state.mjs
      - .github/workflows/firebase-rules-drift-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.target }} rules drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ matrix.environment }}
    # Deliberately outside the deploy concurrency groups. GitHub keeps one
    # pending run per group and cancels the older one when another queues, so
    # a queued check could evict the only staging sync for a rules merge. The
    # cost of not queueing is a check that lands mid-deploy and reports the
    # gap as drift - and only a nightly run can open an issue for that.
    permissions:
      contents: read
      id-token: write
      # Opens and closes the drift tracking issue. Nothing else.
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            environment: tenacity-staging
            project_id: tenacity-tutoring-staging
            storage_bucket: tenacity-tutoring-staging.firebasestorage.app
            workload_identity_provider: projects/354428033510/locations/global/workloadIdentityPools/github/providers/tenacity-platform
            service_account: tenacity-staging-rules@tenacity-tutoring-staging.iam.gserviceaccount.com
          - target: production
            environment: tenacity-production
            project_id: tenacity-tutoring-b8eb2
            storage_bucket: tenacity-tutoring-b8eb2.firebasestorage.app
            workload_identity_provider: projects/398065992407/locations/global/workloadIdentityPools/github/providers/tenacity-platform
            service_account: tenacity-production-rules@tenacity-tutoring-b8eb2.iam.gserviceaccount.com
    env:
      NODE_VERSION: 22.23.1
      FIREBASE_TARGET: ${{ matrix.target }}
      FIREBASE_PROJECT_ID: ${{ matrix.project_id }}
      FIREBASE_STORAGE_BUCKET: ${{ matrix.storage_bucket }}
      FIREBASE_DATABASE_ID: (default)
    steps:
      - name: Check out the commit under test
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify the reviewed target constants
        id: arm_target
        timeout-minutes: 2
        env:
          CONFIGURED_TARGET: ${{ vars.FIREBASE_DEPLOYMENT_TARGET }}
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$CONFIGURED_TARGET" == "$FIREBASE_TARGET" ]]
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_DATABASE_ID" == "$FIREBASE_DATABASE_ID" ]]
          node --input-type=module -e '
            import { assertFirebaseDeploymentTarget } from "./scripts/firebase/firebase-targets.mjs";
            assertFirebaseDeploymentTarget({
              targetName: process.env.FIREBASE_TARGET,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
              databaseId: process.env.FIREBASE_DATABASE_ID,
            });
          '
      - name: Authenticate the scoped Rules identity via federation
        id: configure_credentials
        timeout-minutes: 2
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ matrix.workload_identity_provider }}
          service_account: ${{ matrix.service_account }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.readonly
          create_credentials_file: false
      - name: Compare the live rules against the repository
        id: check_drift
        timeout-minutes: 8
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.configure_credentials.outputs.access_token }}
          DRIFT_DIR: ${{ runner.temp }}/firebase-rules-drift
        run: |
          mkdir -p "$DRIFT_DIR"
          set +e
          node scripts/firebase/firebase-rules-drift.mjs \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --report "${DRIFT_DIR}/report.json" \
            --summary "${DRIFT_DIR}/summary.md" \
            > /dev/null
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [[ -f "${DRIFT_DIR}/summary.md" ]]; then
            cat "${DRIFT_DIR}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$status" == "20" ]]; then
            echo "::error title=Firebase rules drift::The rules deployed to ${FIREBASE_PROJECT_ID} do not match the repository. The job summary names the drifted surfaces and the runbook for this target."
            exit 1
          fi
          exit "$status"
      - name: Publish the drift report
        if: always() && steps.check_drift.outcome != 'skipped'
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-rules-drift-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firebase-rules-drift/
          if-no-files-found: warn
          retention-days: 30
      # A red scheduled run notifies nobody, which is how staging Storage rules
      # sat in drift for three weeks. Persistent drift gets one open issue per
      # target instead, closed by the first run that finds it in sync. Only the
      # nightly run opens one: a push-triggered run can land between a merge
      # and the deploy that follows it, and that gap is not drift.
      - name: Track drift in an issue
        # Not cancelled() rather than a check_drift outcome: a failed login
        # skips the check, and a check that cannot run is worth an issue too.
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CHECK_OUTCOME: ${{ steps.check_drift.outcome }}
          CHECK_STATUS: ${{ steps.check_drift.outputs.status }}
          SUMMARY_PATH: ${{ runner.temp }}/firebase-rules-drift/summary.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Firebase rules drift: ${FIREBASE_TARGET}"
          # Exact-title match: --search tokenises and would also match the
          # other target's issue.
          number="$(
            gh issue list --state open --limit 100 --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" | head -1
          )"

          if [[ "$CHECK_OUTCOME" == "success" ]]; then
            if [[ -n "$number" ]]; then
              gh issue close "$number" --comment "Back in sync as of ${RUN_URL}."
            fi
            exit 0
          fi

          [[ "$EVENT_NAME" == "schedule" ]] || exit 0
          [[ -z "$number" ]] || exit 0

          body_file="${RUNNER_TEMP}/drift-issue.md"
          if [[ "$CHECK_STATUS" == "20" && -f "$SUMMARY_PATH" ]]; then
            cat "$SUMMARY_PATH" > "$body_file"
          else
            printf 'The drift check for %s could not run (exit %s), so drift is unknown.\n' \
              "$FIREBASE_PROJECT_ID" "${CHECK_STATUS:-unknown}" > "$body_file"
          fi
          printf '\nFound by %s. This issue closes itself on the first run that finds %s in sync.\n' \
            "$RUN_URL" "$FIREBASE_TARGET" >> "$body_file"
          gh issue create --title "$title" --body-file "$body_file"
