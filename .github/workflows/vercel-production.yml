# ACTIVE PRODUCTION WORKFLOW: manual dispatch only. Execution requires the
# protected tenacity-production environment, per
# docs/operations/production-deployment-controls.md.
name: Deploy public website to Vercel production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch commit SHA authorized for deployment
        required: true
        type: string
      confirmation:
        description: Type DEPLOY WEBSITE tenacity-tutoring-tqi9
        required: true
        type: string
  workflow_run:
    workflows: ["Validate platform"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  YARN_VERSION: 1.22.19
  VERCEL_CLI_VERSION: 56.4.1
  VERCEL_PROJECT_NAME: tenacity-tutoring-tqi9
  VERCEL_ORG_ID_EXPECTED: team_1di6uZZn3ENj9oo4Porw8yF6
  VERCEL_PROJECT_ID_EXPECTED: prj_MVZzGI3naoD9yo9IrMbWQeChOWhk
  VERCEL_PRODUCTION_DOMAIN: tenacitytutoring.com

jobs:
  context:
    name: Resolve deploy context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      deploy: ${{ steps.resolve.outputs.deploy }}
      trigger: ${{ steps.resolve.outputs.trigger }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 2 so HEAD^ resolves. Required linear history on main
          # guarantees a single parent, so HEAD^ is exactly the previous tip.
          fetch-depth: 2
          ref: ${{ inputs.git_sha || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Resolve trigger and decide whether to deploy
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SURFACE: website
          INPUT_GIT_SHA: ${{ inputs.git_sha }}
          # Attacker-influenced JSON, so it travels by environment and is never
          # interpolated into an argument list.
          WORKFLOW_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: |
          CHANGED_PATHS="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          export CHANGED_PATHS
          node scripts/ci/resolve-deploy-context.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Explain a skipped auto-deploy
        if: steps.resolve.outputs.deploy != 'true'
        run: |
          echo "::notice::Not deploying. ${{ steps.resolve.outputs.reason }}"

  validate:
    needs: context
    if: needs.context.outputs.deploy == 'true'
    name: Validate exact website source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/website
    steps:
      - name: Reject an unauthorized ref or confirmation
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          AUTHORIZED_SHA: ${{ needs.context.outputs.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$AUTHORIZED_SHA" ]]
          [[ "$CONFIRMATION" == "DEPLOY WEBSITE tenacity-tutoring-tqi9" ]]
      - name: Check out authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Activate exact Yarn release
        run: |
          corepack enable
          corepack prepare "yarn@${YARN_VERSION}" --activate
      - name: Install, lint, and build
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn lint
          yarn build
          node -e 'const c=require("./vercel.json");if(c.github?.autoAlias!==false)process.exit(1)'

  open-record:
    name: Open deploy record
    needs: [context, validate]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Website
      git_sha: ${{ needs.context.outputs.sha }}
      action: open

  deploy:
    name: Stage, smoke-test, and promote authorized website
    needs: [context, validate, open-record]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: tenacity-production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Verify the reviewed target constants
        run: |
          [[ "$VERCEL_ORG_ID" == "$VERCEL_ORG_ID_EXPECTED" ]]
          [[ "$VERCEL_PROJECT_ID" == "$VERCEL_PROJECT_ID_EXPECTED" ]]
          [[ -n "$VERCEL_TOKEN" ]]
      - name: Check out authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Recheck authorized SHA after environment gate
        if: needs.context.outputs.trigger == 'dispatch'
        env:
          AUTHORIZED_SHA: ${{ needs.context.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$AUTHORIZED_SHA" ]]
      - name: Inspect canonical project and current production deployment
        run: |
          reports_dir="${RUNNER_TEMP}/vercel-deploy-reports"
          mkdir -p "$reports_dir"
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- \
            vercel project inspect "$VERCEL_PROJECT_NAME" \
            --yes \
            --token "$VERCEL_TOKEN" \
            > "$reports_dir/project-before.txt"
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- \
            vercel inspect "$VERCEL_PRODUCTION_DOMAIN" \
            --format=json \
            --token "$VERCEL_TOKEN" \
            > "$reports_dir/production-before.json"
      - name: Stage a production build without assigning domains
        env:
          AUTHORIZED_SHA: ${{ needs.context.outputs.sha }}
        run: |
          reports_dir="${RUNNER_TEMP}/vercel-deploy-reports"
          # Deploy from the repository root. The Vercel project's Root
          # Directory setting is apps/website and is applied on top of the
          # uploaded source, so passing --cwd apps/website here would resolve
          # to apps/website/apps/website and fail. This matches how the Vercel
          # Git integration builds the project.
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- \
            vercel deploy \
            --project "$VERCEL_PROJECT_ID" \
            --prod \
            --skip-domain \
            --yes \
            --format=json \
            --meta "tenacityGitSha=$AUTHORIZED_SHA" \
            --token "$VERCEL_TOKEN" \
            > "$reports_dir/staged-deployment.json"
          node -e '
            const fs = require("node:fs");
            const root = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const deployment = root.deployment ?? root;
            if (!/^dpl_[A-Za-z0-9]+$/.test(deployment.id ?? "")) process.exit(1);
            const url = new URL(deployment.url);
            if (url.protocol !== "https:" || !url.hostname.endsWith(".vercel.app") || url.pathname !== "/") process.exit(1);
            const apiUrl = new URL(deployment.deploymentApiUrl);
            if (apiUrl.origin !== "https://api.vercel.com" || apiUrl.pathname !== `/v13/deployments/${deployment.id}`) process.exit(1);
            if (deployment.readyState !== "READY" || deployment.target !== "production") process.exit(1);
            process.stdout.write([
              `STAGED_URL=${url.origin}`,
              `STAGED_DEPLOYMENT_ID=${deployment.id}`,
              `STAGED_DEPLOYMENT_API_URL=${apiUrl.href}`,
              "",
            ].join("\n"));
          ' "$reports_dir/staged-deployment.json" >> "$GITHUB_ENV"
          node -e '
            const fs = require("node:fs");
            const root = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const deployment = root.deployment ?? root;
            process.stdout.write(`${deployment.url}\n`);
          ' "$reports_dir/staged-deployment.json" > "$reports_dir/staged-url.txt"
      - name: Wait for and verify the staged deployment
        env:
          AUTHORIZED_SHA: ${{ needs.context.outputs.sha }}
        run: |
          reports_dir="${RUNNER_TEMP}/vercel-deploy-reports"
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- \
            vercel inspect "$STAGED_URL" \
            --wait \
            --timeout 10m \
            --format=json \
            --token "$VERCEL_TOKEN" \
            > "$reports_dir/staged-inspection.json"
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (data.id !== process.env.STAGED_DEPLOYMENT_ID) process.exit(1);
            if (data.name !== process.env.VERCEL_PROJECT_NAME) process.exit(1);
            if (data.readyState !== "READY" || data.target !== "production") process.exit(1);
          ' \
            "$reports_dir/staged-inspection.json"
          curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            "$STAGED_DEPLOYMENT_API_URL" \
            > "${RUNNER_TEMP}/vercel-staged-deployment-api.json"
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const stagedHostname = new URL(process.env.STAGED_URL).hostname;
            if (data.id !== process.env.STAGED_DEPLOYMENT_ID) process.exit(1);
            if (data.url !== stagedHostname) process.exit(1);
            if (data.name !== process.env.VERCEL_PROJECT_NAME) process.exit(1);
            if (data.team?.id !== process.env.VERCEL_ORG_ID_EXPECTED) process.exit(1);
            if (data.projectId !== process.env.VERCEL_PROJECT_ID_EXPECTED) process.exit(1);
            if (data.readyState !== "READY" || data.target !== "production") process.exit(1);
            if (data.meta?.tenacityGitSha !== process.env.AUTHORIZED_SHA) process.exit(1);
            if (data.autoAssignCustomDomains !== false) process.exit(1);
            if (!Array.isArray(data.alias) || data.alias.includes(process.env.VERCEL_PRODUCTION_DOMAIN)) process.exit(1);
            const evidence = {
              id: data.id,
              url: data.url,
              name: data.name,
              teamId: data.team.id,
              projectId: data.projectId,
              readyState: data.readyState,
              target: data.target,
              authorizedSha: data.meta.tenacityGitSha,
              autoAssignCustomDomains: data.autoAssignCustomDomains,
              aliases: data.alias,
            };
            process.stdout.write(`${JSON.stringify(evidence, null, 2)}\n`);
          ' "${RUNNER_TEMP}/vercel-staged-deployment-api.json" \
            > "$reports_dir/staged-deployment-verified.json"
      - name: Smoke-test staged public routes without mutations
        run: |
          for path in / /register; do
            curl --fail --silent --show-error --location "${STAGED_URL}${path}" > /dev/null
          done
      - name: Promote the exact staged deployment
        run: |
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- \
            vercel promote "$STAGED_URL" \
            --yes \
            --token "$VERCEL_TOKEN"
          npm exec --yes --package="vercel@${VERCEL_CLI_VERSION}" -- \
            vercel inspect "$VERCEL_PRODUCTION_DOMAIN" \
            --format=json \
            --token "$VERCEL_TOKEN" \
            > "${RUNNER_TEMP}/vercel-deploy-reports/production-after.json"
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (data.id !== process.env.STAGED_DEPLOYMENT_ID) process.exit(1);
            if (data.name !== process.env.VERCEL_PROJECT_NAME) process.exit(1);
            if (data.readyState !== "READY" || data.target !== "production") process.exit(1);
          ' "${RUNNER_TEMP}/vercel-deploy-reports/production-after.json"
      - name: Smoke-test live public routes without mutations
        run: |
          for path in / /register; do
            curl --fail --silent --show-error --location \
              "https://${VERCEL_PRODUCTION_DOMAIN}${path}" > /dev/null
          done
      - name: Upload Vercel deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vercel-production-deployment-evidence
          path: ${{ runner.temp }}/vercel-deploy-reports
          if-no-files-found: warn
          retention-days: 90
      - name: Remove raw deployment payload
        if: always()
        run: |
          [[ -n "$RUNNER_TEMP" ]]
          rm -f "$RUNNER_TEMP/vercel-staged-deployment-api.json"

  close-record:
    name: Close deploy record
    needs: [context, open-record, deploy]
    if: always() && needs.open-record.result == 'success'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Website
      git_sha: ${{ needs.context.outputs.sha }}
      action: close
      outcome: ${{ needs.deploy.result }}
