# ACTIVE PRODUCTION WORKFLOW: manual dispatch only. Execution requires the
# protected tenacity-production environment, per
# docs/operations/production-deployment-controls.md.
name: Deploy Firebase Functions to production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch commit SHA authorized for deployment
        required: true
        type: string
      confirmation:
        description: Type DEPLOY FUNCTIONS tenacity-tutoring-b8eb2
        required: true
        type: string
      allow_minimum_bill_increase:
        description: >-
          Tick only for a reviewed change that raises the standing bill (a new
          or higher minInstances). Applies only to batches whose dry run
          refuses for that reason.
        required: false
        type: boolean
        default: false
      deploy_all:
        description: >-
          Deploy every Function instead of only the ones changed since the last
          successful deploy. Tick after a Secret Manager change or a deploy made
          outside this workflow, neither of which shows in a git diff.
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      git_sha:
        required: true
        type: string
      confirmation:
        required: true
        type: string
      allow_minimum_bill_increase:
        required: false
        type: boolean
        default: false
      deploy_all:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tenacity-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TOOLS_VERSION: 15.20.0
  FIREBASE_PROJECT_ID: tenacity-tutoring-b8eb2

jobs:
  validate:
    name: Validate exact Function source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reject an unauthorized ref or confirmation
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$AUTHORIZED_SHA" ]]
          [[ "$CONFIRMATION" == "DEPLOY FUNCTIONS tenacity-tutoring-b8eb2" ]]
      - name: Check out authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/firebase/functions/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install exact dependencies
        run: |
          npm ci --prefix backend/firebase/functions
          npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Run Function validation
        run: |
          node scripts/ci/validate-firebase-config.mjs
          npm --prefix backend/firebase/functions test
          npm --prefix backend/firebase/functions run smoke
          npm --prefix backend/firebase/functions run test:emulator
          node scripts/ci/check-functions-inventory.mjs
      - name: Render resource fixtures
        run: |
          npm --prefix backend/firebase/functions run test:resources:render -- "${RUNNER_TEMP}/resource-fixtures"
          npm --prefix backend/firebase/functions run test:diagrams:render -- "${RUNNER_TEMP}/diagram-fixtures"

  open-record:
    name: Open deploy record
    needs: validate
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Functions
      git_sha: ${{ inputs.git_sha }}
      action: open

  deploy:
    name: Authorized Function deployment
    needs: [validate, open-record]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: tenacity-production
    permissions:
      # Reads this workflow's own job history to find the last successful deploy.
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Verify the reviewed target constants
        env:
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
      - name: Check out authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full commit history without old file contents: the deploy scope is
          # diffed against the last successful deploy, however far back it is.
          fetch-depth: 0
          filter: blob:none
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/firebase/functions/package-lock.json
      - name: Install exact dependencies
        run: |
          npm ci --prefix backend/firebase/functions
          npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Recheck authorized SHA after environment gate
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$AUTHORIZED_SHA" ]]
      - name: Authenticate the scoped production Function identity via federation
        id: configure_credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/398065992407/locations/global/workloadIdentityPools/github/providers/tenacity-platform
          service_account: tenacity-production-functions@tenacity-tutoring-b8eb2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
      - name: Capture and verify pre-deploy inventory
        run: |
          reports_dir="${RUNNER_TEMP}/function-deploy-reports"
          raw_dir="${RUNNER_TEMP}/function-inventory-raw"
          mkdir -p "$reports_dir" "$raw_dir"
          printf 'batch\tdeploy_exit\tinventory_exit\tverification_exit\tselector\n' \
            > "$reports_dir/batch-status.tsv"
          source scripts/ci/firebase-retry.sh
          firebase_functions_list "$raw_dir/functions-before.json"
          node scripts/ci/check-functions-inventory.mjs \
            --redact-live "$raw_dir/functions-before.json" \
            --report "$reports_dir/evidence-before.json"
          node scripts/ci/check-functions-inventory.mjs \
            --live "$raw_dir/functions-before.json" \
            --pre-deploy \
            --report "$reports_dir/before.json"
      # Deploys only the Functions changed since the last successful deploy
      # (TP-44). Skipping an unchanged Function is safe because the check the
      # scoping rests on, that no local require escapes the module graph, runs
      # against the source in validate.yml. Anything the resolver cannot
      # account for, including its own failure, widens to a full deploy.
      - name: Choose the Functions this deploy covers
        env:
          DEPLOY_ALL: ${{ inputs.deploy_all }}
          GH_TOKEN: ${{ github.token }}
        run: |
          reports_dir="${RUNNER_TEMP}/function-deploy-reports"
          raw_dir="${RUNNER_TEMP}/function-inventory-raw"
          plan="$reports_dir/scoped-deploy.json"
          selectors_file="$reports_dir/selectors.txt"
          resolver=(node scripts/ci/resolve-function-deploys.mjs --report "$plan")
          if [[ "$DEPLOY_ALL" == "true" ]]; then
            "${resolver[@]}" --all --reason "Requested with deploy_all."
          else
            last_deployed="$(node scripts/ci/find-last-function-deploy.mjs)" || last_deployed=""
            "${resolver[@]}" \
              --last-deployed "${last_deployed:-none}" \
              --head HEAD \
              --pending-from "$reports_dir/before.json" \
              || "${resolver[@]}" --all --reason "Deploy scoping failed; deploying everything."
          fi
          node -e 'for (const s of require(process.argv[1]).selectors) console.log(s)' "$plan" \
            > "$selectors_file"
          mapfile -t selectors < "$selectors_file"
          # Derived from the plan rather than written down: a literal here once
          # failed inside the production window when one Function was added.
          expected_batches="$(node -e 'process.stdout.write(String(Math.ceil(require(process.argv[1]).deployCount / 10)))' "$plan")"
          [[ "${#selectors[@]}" -eq "$expected_batches" ]]
          for selector in "${selectors[@]}"; do
            [[ "$selector" =~ ^functions:default:[A-Za-z0-9_-]+(,functions:default:[A-Za-z0-9_-]+)*$ ]]
            IFS=',' read -r -a names <<< "$selector"
            [[ "${#names[@]}" -ge 1 && "${#names[@]}" -le 10 ]]
          done
          # The batches ship exactly the planned set, and every managed Function
          # is either in it or recorded as unchanged: none invented, none dropped.
          tr ',' '\n' < "$selectors_file" \
            | sed 's/^functions:default://' | sort > "$raw_dir/selected-names.txt"
          node -e 'for (const n of require(process.argv[1]).deploy) console.log(n)' "$plan" \
            | sort > "$raw_dir/planned-names.txt"
          diff "$raw_dir/planned-names.txt" "$raw_dir/selected-names.txt"
          node -e 'const r = require(process.argv[1]); for (const n of [...r.deploy, ...r.skipped]) console.log(n)' "$plan" \
            | sort > "$raw_dir/accounted-names.txt"
          node -e 'const p = require("./backend/firebase/inventory/production-functions.json"); process.stdout.write(p.managed.names.join("\n") + "\n")' \
            | sort > "$raw_dir/policy-names.txt"
          diff "$raw_dir/policy-names.txt" "$raw_dir/accounted-names.txt"
          node -e '
            const r = require(process.argv[1]);
            console.log(`::notice::${r.mode}: deploying ${r.deployCount}/${r.managedCount} ` +
              `in ${r.batches} batches. ${r.reason}`);
          ' "$plan"
      # Firebase refuses, without its --force flag, any deploy that raises the
      # standing bill (a new or higher minInstances). --force also skips every
      # other confirmation, so it is never passed blind: only when the operator
      # ticked allow_minimum_bill_increase, only for a batch whose dry run
      # refused for exactly that reason, and only after that batch passes a
      # forced dry run. The batches needing it are recorded for the deploy.
      - name: Run a privileged dry run for every explicit batch
        env:
          ALLOW_MINIMUM_BILL_INCREASE: ${{ inputs.allow_minimum_bill_increase }}
        run: |
          reports_dir="${RUNNER_TEMP}/function-deploy-reports"
          bill_selectors="$reports_dir/minimum-bill-selectors.txt"
          : > "$bill_selectors"
          # Retries only Google's transient "Failed to list functions" (TP-45).
          source scripts/ci/firebase-retry.sh
          while IFS= read -r selector; do
            set +e
            firebase_deploy "$reports_dir/dry-run.log" \
              --config firebase.json \
              --project "$FIREBASE_PROJECT_ID" \
              --only "$selector" \
              --dry-run \
              --non-interactive
            dry_run_status=$?
            set -e
            [[ "$dry_run_status" -eq 0 ]] && continue
            if ! grep -q "Pass the --force option to deploy functions that increase the minimum bill" "$reports_dir/dry-run.log"; then
              exit "$dry_run_status"
            fi
            if [[ "$ALLOW_MINIMUM_BILL_INCREASE" != "true" ]]; then
              echo "::error::This batch raises the minimum bill: $selector. Re-dispatch with allow_minimum_bill_increase once the cost is approved."
              exit 1
            fi
            force_args=(--force)
            firebase_deploy "$reports_dir/forced-dry-run.log" \
              --config firebase.json \
              --project "$FIREBASE_PROJECT_ID" \
              --only "$selector" \
              --dry-run \
              --non-interactive \
              "${force_args[@]}"
            echo "$selector" >> "$bill_selectors"
            echo "::notice::Minimum bill increase approved for: $selector"
          done < "$reports_dir/selectors.txt"
      - name: Deploy reviewed Functions in bounded batches
        run: |
          reports_dir="${RUNNER_TEMP}/function-deploy-reports"
          raw_dir="${RUNNER_TEMP}/function-inventory-raw"
          status_file="$reports_dir/batch-status.tsv"
          # Google's list API intermittently answers "Failed to list functions
          # for <project>" mid-run. Deploys retry only that error; any other
          # deploy failure still stops the run on its first attempt. The list
          # call is read-only and retries any failure (TP-45).
          source scripts/ci/firebase-retry.sh
          # A short gap between batches eases the list-API pressure that
          # back-to-back deploys put on the project.
          batch_pause_seconds=15
          batch_number=0
          # A deploy with nothing to ship has no post-batch list to check.
          current_inventory="$raw_dir/functions-before.json"
          while IFS= read -r selector; do
            batch_number=$((batch_number + 1))
            if [[ "$batch_number" -gt 1 ]]; then
              sleep "$batch_pause_seconds"
            fi
            echo "Deploying batch $batch_number: $selector"
            deploy_args=()
            if grep -qxF "$selector" "$reports_dir/minimum-bill-selectors.txt"; then
              deploy_args=(--force)
            fi
            set +e
            firebase_deploy "$reports_dir/deploy-batch-${batch_number}.log" \
              --config firebase.json \
              --project "$FIREBASE_PROJECT_ID" \
              --only "$selector" \
              --non-interactive \
              "${deploy_args[@]}"
            deploy_status=$?
            set -e
            current_inventory="$raw_dir/functions-after-batch-${batch_number}.json"
            set +e
            firebase_functions_list "$current_inventory"
            inventory_status=$?
            set -e
            verification_status=125
            if [[ "$inventory_status" -eq 0 ]]; then
              set +e
              node scripts/ci/check-functions-inventory.mjs \
                --redact-live "$current_inventory" \
                --report "$reports_dir/evidence-after-batch-${batch_number}.json"
              evidence_status=$?
              set -e
              if [[ "$evidence_status" -ne 0 ]]; then
                verification_status=126
              else
                set +e
                node scripts/ci/check-functions-inventory.mjs \
                  --live "$current_inventory" \
                  --pre-deploy \
                  --before-live "$raw_dir/functions-before.json" \
                  --after-live "$current_inventory" \
                  --report "$reports_dir/verified-after-batch-${batch_number}.json"
                verification_status=$?
                set -e
              fi
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$batch_number" \
              "$deploy_status" \
              "$inventory_status" \
              "$verification_status" \
              "$selector" >> "$status_file"
            if [[ "$deploy_status" -ne 0 || "$inventory_status" -ne 0 || "$verification_status" -ne 0 ]]; then
              echo "Batch $batch_number failed after transient-error retries; rerun the job to finish."
              exit 1
            fi
          done < "$reports_dir/selectors.txt"
          node scripts/ci/check-functions-inventory.mjs \
            --live "$current_inventory" \
            --before-live "$raw_dir/functions-before.json" \
            --after-live "$current_inventory" \
            --report "$reports_dir/final.json"
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-function-deployment-reports
          path: ${{ runner.temp }}/function-deploy-reports
          if-no-files-found: warn
          retention-days: 90
      - name: Remove temporary credentials
        if: always()
        run: |
          [[ -n "$RUNNER_TEMP" ]]
          if [[ -n "${GOOGLE_GHA_CREDS_PATH:-}" ]]; then
            rm -f "$GOOGLE_GHA_CREDS_PATH"
          fi
          rm -rf "$RUNNER_TEMP/function-inventory-raw"

  close-record:
    name: Close deploy record
    needs: [open-record, deploy]
    if: always() && needs.open-record.result == 'success'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Functions
      git_sha: ${{ inputs.git_sha }}
      action: close
      outcome: ${{ needs.deploy.result }}
