# ACTIVE PRODUCTION WORKFLOW: manual dispatch only. Execution requires the
# protected tenacity-production environment, per
# docs/operations/production-deployment-controls.md.
name: Deploy admin portal Hosting to production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full main-branch commit SHA authorized for deployment
        required: true
        type: string
      confirmation:
        description: Type DEPLOY HOSTING tenacity-tutoring-b8eb2
        required: true
        type: string
  workflow_run:
    workflows: ["Validate platform"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-portal
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TOOLS_VERSION: 15.20.0
  FIREBASE_PROJECT_ID: tenacity-tutoring-b8eb2
  FIREBASE_HOSTING_SITE: tenacity-tutoring-b8eb2
  FIREBASE_HOSTING_TARGET: admin-portal

jobs:
  context:
    name: Resolve deploy context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      deploy: ${{ steps.resolve.outputs.deploy }}
      trigger: ${{ steps.resolve.outputs.trigger }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth 2 so HEAD^ resolves. Required linear history on main
          # guarantees a single parent, so HEAD^ is exactly the previous tip.
          fetch-depth: 2
          ref: ${{ inputs.git_sha || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Resolve trigger and decide whether to deploy
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SURFACE: portal
          INPUT_GIT_SHA: ${{ inputs.git_sha }}
          # Attacker-influenced JSON, so it travels by environment and is never
          # interpolated into an argument list.
          WORKFLOW_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: |
          CHANGED_PATHS="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          export CHANGED_PATHS
          node scripts/ci/resolve-deploy-context.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Explain a skipped auto-deploy
        if: steps.resolve.outputs.deploy != 'true'
        run: |
          echo "::notice::Not deploying. ${{ steps.resolve.outputs.reason }}"

  validate:
    needs: context
    if: needs.context.outputs.deploy == 'true'
    name: Validate exact portal source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Reject an unauthorized ref or confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          AUTHORIZED_SHA: ${{ needs.context.outputs.sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$AUTHORIZED_SHA" ]]
          [[ "$CONFIRMATION" == "DEPLOY HOSTING tenacity-tutoring-b8eb2" ]]
      - name: Check out authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json
      - name: Install exact dependencies
        run: npm ci --prefix apps/admin-portal
      - name: Test and build without production credentials
        run: |
          node scripts/ci/validate-firebase-config.mjs
          npm --prefix apps/admin-portal test
          node --test apps/admin-portal/test/enrolmentEditPayload.test.mjs
          npm --prefix apps/admin-portal run build

  open-record:
    name: Open deploy record
    needs: [context, validate]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Admin Hosting
      git_sha: ${{ needs.context.outputs.sha }}
      action: open

  deploy:
    name: Stage, smoke-test, and promote authorized portal
    needs: [context, validate, open-record]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: tenacity-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify the reviewed target constants
        env:
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
          CONFIGURED_TARGET: ${{ vars.FIREBASE_HOSTING_TARGET }}
        run: |
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_SITE" == "$FIREBASE_HOSTING_SITE" ]]
          [[ "$CONFIGURED_TARGET" == "$FIREBASE_HOSTING_TARGET" ]]
      - name: Check out authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json
      - name: Install exact dependencies
        run: |
          npm ci --prefix apps/admin-portal
          npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Recheck authorized SHA after environment gate
        if: needs.context.outputs.trigger == 'dispatch'
        env:
          AUTHORIZED_SHA: ${{ needs.context.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$AUTHORIZED_SHA" ]]
      - name: Authenticate the scoped production Hosting identity via federation
        id: configure_credentials
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/398065992407/locations/global/workloadIdentityPools/github/providers/tenacity-platform
          service_account: tenacity-production-hosting@tenacity-tutoring-b8eb2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
      - name: Build portal with authorized production client configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          # Only these three are populated in the current production build.
          [[ -n "$VITE_FIREBASE_API_KEY" ]]
          [[ -n "$VITE_FIREBASE_AUTH_DOMAIN" ]]
          [[ "$VITE_FIREBASE_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          # Storage bucket, messaging sender ID, and app ID are intentionally
          # empty to reproduce the exact live production client config during
          # the no-op cutover (verified from the deployed portal bundle). Do
          # not require them non-empty here; populating them is a deliberate
          # post-cutover change, not part of the no-op.
          npm --prefix apps/admin-portal run build
      - name: Capture current live channel and stage preview
        env:
          AUTHORIZED_SHA: ${{ needs.context.outputs.sha }}
        run: |
          reports_dir="${RUNNER_TEMP}/hosting-deploy-reports"
          mkdir -p "$reports_dir"
          # The channel is kept for 30 days (the provider maximum) rather than
          # one, because it is the only thing a CLI rollback can clone from:
          # `hosting:clone` takes `siteId:channelId` and there is no
          # `hosting:rollback`. A one-day channel means no rollback target
          # tomorrow. See firebase-hosting-rollback-production.yml.
          channel_id="cutover-${AUTHORIZED_SHA:0:12}-${GITHUB_RUN_ATTEMPT}"
          echo "CHANNEL_ID=$channel_id" >> "$GITHUB_ENV"
          firebase hosting:channel:list \
            --site "$FIREBASE_HOSTING_SITE" \
            --project "$FIREBASE_PROJECT_ID" \
            --json > "$reports_dir/channels-before.json"
          firebase hosting:channel:deploy "$channel_id" \
            --config firebase.json \
            --project "$FIREBASE_PROJECT_ID" \
            --only "$FIREBASE_HOSTING_TARGET" \
            --expires 30d \
            --no-authorized-domains \
            --non-interactive \
            --json > "$reports_dir/preview.json"
          preview_url="$(node -e 'const fs=require("fs");const root=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const queue=[root];while(queue.length){const value=queue.shift();if(value&&typeof value==="object"){if(typeof value.url==="string"){process.stdout.write(value.url);process.exit(0)}queue.push(...Object.values(value));}}process.exit(1);' "$reports_dir/preview.json")"
          [[ "$preview_url" == https://* ]]
          printf '%s\n' "$preview_url" > "$reports_dir/preview-url.txt"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
      - name: Smoke-test the public preview without mutations
        run: |
          for path in / /terms.html /reset_password.html; do
            curl --fail --silent --show-error --location "${PREVIEW_URL}${path}" > /dev/null
          done
      - name: Promote the exact preview version to live
        run: |
          firebase hosting:clone \
            "${FIREBASE_HOSTING_SITE}:${CHANNEL_ID}" \
            "${FIREBASE_HOSTING_SITE}:live" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
          firebase hosting:channel:list \
            --site "$FIREBASE_HOSTING_SITE" \
            --project "$FIREBASE_PROJECT_ID" \
            --json > "${RUNNER_TEMP}/hosting-deploy-reports/channels-after.json"
      - name: Smoke-test live static routes
        run: |
          for origin in \
            "https://${FIREBASE_HOSTING_SITE}.web.app" \
            "https://admin.tenacitytutoring.com"; do
            for path in / /terms.html /reset_password.html; do
              curl --fail --silent --show-error --location "${origin}${path}" > /dev/null
            done
          done
      - name: Upload Hosting deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-hosting-deployment-evidence
          path: ${{ runner.temp }}/hosting-deploy-reports
          if-no-files-found: warn
          retention-days: 90
      - name: Remove temporary credentials
        if: always()
        run: |
          if [[ -n "${GOOGLE_GHA_CREDS_PATH:-}" ]]; then
            rm -f "$GOOGLE_GHA_CREDS_PATH"
          fi

  close-record:
    name: Close deploy record
    needs: [context, open-record, deploy]
    if: always() && needs.open-record.result == 'success'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Admin Hosting
      git_sha: ${{ needs.context.outputs.sha }}
      action: close
      outcome: ${{ needs.deploy.result }}
