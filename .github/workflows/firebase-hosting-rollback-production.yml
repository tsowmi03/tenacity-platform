# ACTIVE PRODUCTION WORKFLOW: manual dispatch only. Execution requires the
# protected tenacity-production environment, per
# docs/operations/production-deployment-controls.md.
#
# The admin portal deploys automatically on a merge to main, so recovery must
# not depend on someone having been watching.
#
# Firebase has no `hosting:rollback`, and `hosting:clone` accepts only
# `siteId:channelId` — not a version ID. So a rollback clones a previous
# deploy's preview channel back to live. Every deploy leaves one named
# `cutover-<sha12>-<attempt>`, retained 30 days; `hosting:channel:list` (also
# captured as `channels-before.json` in each deploy's evidence) shows what is
# available. Older than that is a console operation.
name: Roll back admin portal Hosting

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: Channel to clone back to live, e.g. cutover-1c156b367708-1
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK HOSTING tenacity-tutoring-b8eb2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-portal
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TOOLS_VERSION: 15.20.0
  FIREBASE_PROJECT_ID: tenacity-tutoring-b8eb2
  FIREBASE_HOSTING_SITE: tenacity-tutoring-b8eb2

jobs:
  rollback:
    name: Roll back admin portal Hosting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: tenacity-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject an unauthorized request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CHANNEL_ID: ${{ inputs.channel_id }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$CONFIRMATION" == "ROLLBACK HOSTING tenacity-tutoring-b8eb2" ]]
          # Channel IDs are provider-generated; refuse anything that could carry
          # a second `site:channel` pair into the clone arguments.
          [[ "$CHANNEL_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,62}$ ]]
          [[ "$CHANNEL_ID" != "live" ]]
      - name: Verify the reviewed target constants
        env:
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
        run: |
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_SITE" == "$FIREBASE_HOSTING_SITE" ]]
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the exact Firebase CLI
        run: npm install --global "firebase-tools@${FIREBASE_TOOLS_VERSION}"
      - name: Authenticate the scoped production Hosting identity via federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/398065992407/locations/global/workloadIdentityPools/github/providers/tenacity-platform
          service_account: tenacity-production-hosting@tenacity-tutoring-b8eb2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
      - name: Confirm the requested channel still exists
        env:
          CHANNEL_ID: ${{ inputs.channel_id }}
        run: |
          reports_dir="${RUNNER_TEMP}/hosting-rollback-reports"
          mkdir -p "$reports_dir"
          firebase hosting:channel:list \
            --site "$FIREBASE_HOSTING_SITE" \
            --project "$FIREBASE_PROJECT_ID" \
            --json > "$reports_dir/channels-before.json"
          node -e '
            const fs = require("node:fs");
            const wanted = process.argv[2];
            const root = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const ids = JSON.stringify(root).match(/"[^"]*channels\/[^"]+"/g) ?? [];
            const found = ids.some((entry) => entry.endsWith(`/${wanted}"`));
            if (!found) {
              console.error(`Channel ${wanted} not found. It may have expired.`);
              console.error("Available:", ids.join(", "));
              process.exit(1);
            }
          ' "$reports_dir/channels-before.json" "$CHANNEL_ID"
      - name: Clone the channel back to live
        env:
          CHANNEL_ID: ${{ inputs.channel_id }}
        run: |
          firebase hosting:clone \
            "${FIREBASE_HOSTING_SITE}:${CHANNEL_ID}" \
            "${FIREBASE_HOSTING_SITE}:live" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive
      - name: Smoke-test live static routes
        run: |
          for path in / /terms.html /reset_password.html; do
            curl --fail --silent --show-error --location \
              "https://${FIREBASE_HOSTING_SITE}.web.app${path}" > /dev/null
          done
      - name: Record the resulting channel state
        if: always()
        run: |
          firebase hosting:channel:list \
            --site "$FIREBASE_HOSTING_SITE" \
            --project "$FIREBASE_PROJECT_ID" \
            --json > "${RUNNER_TEMP}/hosting-rollback-reports/channels-after.json" || true
      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosting-rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosting-rollback-reports
          if-no-files-found: warn
          retention-days: 90
      - name: Remove temporary credentials
        if: always()
        run: |
          if [[ -n "${GOOGLE_GHA_CREDS_PATH:-}" ]]; then
            rm -f "$GOOGLE_GHA_CREDS_PATH"
          fi
