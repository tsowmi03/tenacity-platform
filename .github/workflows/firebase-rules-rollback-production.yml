# ACTIVE PRODUCTION WORKFLOW: manual dispatch only. Execution requires the
# protected tenacity-production environment, per
# docs/operations/production-deployment-controls.md.
name: Roll back Firebase rules in production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: Full current main-branch SHA authorized to run rollback code
        required: true
        type: string
      deployment_run_id:
        description: Completed Rules deployment workflow run ID
        required: true
        type: string
      deployment_run_attempt:
        description: Completed Rules deployment workflow run attempt
        required: true
        type: string
      prior_snapshot_digest:
        description: SHA-256 digest from rules-before.json
        required: true
        type: string
      current_snapshot_digest:
        description: SHA-256 digest from rules-after.json
        required: true
        type: string
      freeze_confirmation:
        description: Type TENACITY DEPLOYMENTS FROZEN
        required: true
        type: string
      confirmation:
        description: Type the digest-bound ROLLBACK FIREBASE RULES confirmation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: tenacity-production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  FIREBASE_TARGET: production
  FIREBASE_PROJECT_ID: tenacity-tutoring-b8eb2
  FIREBASE_STORAGE_BUCKET: tenacity-tutoring-b8eb2.firebasestorage.app
  FIREBASE_DATABASE_ID: (default)
  DEPLOYMENT_WORKFLOW_PATH: .github/workflows/firebase-rules-production.yml

jobs:
  validate:
    name: Validate rollback request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reject an unauthorized ref or rollback request
        timeout-minutes: 2
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          DEPLOYMENT_RUN_ATTEMPT: ${{ inputs.deployment_run_attempt }}
          PRIOR_DIGEST: ${{ inputs.prior_snapshot_digest }}
          CURRENT_DIGEST: ${{ inputs.current_snapshot_digest }}
          FREEZE_CONFIRMATION: ${{ inputs.freeze_confirmation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$GITHUB_REPOSITORY" == "tsowmi03/tenacity-platform" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$AUTHORIZED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$AUTHORIZED_SHA" ]]
          [[ "$DEPLOYMENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOYMENT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRIOR_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CURRENT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PRIOR_DIGEST" != "$CURRENT_DIGEST" ]]
          [[ "$FREEZE_CONFIRMATION" == "TENACITY DEPLOYMENTS FROZEN" ]]
          expected="ROLLBACK FIREBASE RULES ${FIREBASE_PROJECT_ID} FROM ${CURRENT_DIGEST} TO ${PRIOR_DIGEST}"
          [[ "$CONFIRMATION" == "$expected" ]]
      - name: Check out authorized commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate reviewed Firebase configuration
        timeout-minutes: 5
        run: node scripts/ci/validate-firebase-config.mjs

  open-record:
    name: Open deploy record
    needs: validate
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Rules rollback
      git_sha: ${{ inputs.git_sha }}
      action: open

  rollback:
    name: Authorized Rules rollback
    needs: [validate, open-record]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment: tenacity-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out authorized commit
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git_sha }}
          persist-credentials: false
      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Recheck authorized SHA after environment gate
        id: recheck_sha
        timeout-minutes: 2
        env:
          AUTHORIZED_SHA: ${{ inputs.git_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          current_main_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha'
          )"
          [[ "$current_main_sha" == "$AUTHORIZED_SHA" ]]
      - name: Verify the reviewed target constants
        id: arm_target
        timeout-minutes: 2
        env:
          CONFIGURED_TARGET: ${{ vars.FIREBASE_DEPLOYMENT_TARGET }}
          CONFIGURED_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CONFIGURED_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          CONFIGURED_DATABASE_ID: ${{ vars.FIREBASE_DATABASE_ID }}
          FREEZE_CONFIRMATION: ${{ inputs.freeze_confirmation }}
        run: |
          [[ "$CONFIGURED_TARGET" == "$FIREBASE_TARGET" ]]
          [[ "$CONFIGURED_PROJECT_ID" == "$FIREBASE_PROJECT_ID" ]]
          [[ "$CONFIGURED_STORAGE_BUCKET" == "$FIREBASE_STORAGE_BUCKET" ]]
          [[ "$CONFIGURED_DATABASE_ID" == "$FIREBASE_DATABASE_ID" ]]
          [[ "$FREEZE_CONFIRMATION" == "TENACITY DEPLOYMENTS FROZEN" ]]
          node --input-type=module -e '
            import { assertFirebaseDeploymentTarget } from "./scripts/firebase/firebase-targets.mjs";
            assertFirebaseDeploymentTarget({
              targetName: process.env.FIREBASE_TARGET,
              projectId: process.env.FIREBASE_PROJECT_ID,
              storageBucket: process.env.FIREBASE_STORAGE_BUCKET,
              databaseId: process.env.FIREBASE_DATABASE_ID,
            });
          '
      - name: Prepare the rollback evidence directory
        id: prepare_evidence_dir
        timeout-minutes: 1
        run: mkdir -p "${RUNNER_TEMP}/firebase-rules-rollback-evidence"
      - name: Authenticate the scoped production Rules identity via federation
        id: configure_credentials
        timeout-minutes: 2
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/398065992407/locations/global/workloadIdentityPools/github/providers/tenacity-platform
          service_account: tenacity-production-rules@tenacity-tutoring-b8eb2.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: true
      - name: Verify the exact completed deployment run
        id: verify_deployment_run
        timeout-minutes: 4
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          DEPLOYMENT_RUN_ATTEMPT: ${{ inputs.deployment_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}/attempts/${DEPLOYMENT_RUN_ATTEMPT}" \
            > "${evidence_dir}/deployment-run.json"
          DEPLOYMENT_RUN_PATH="${evidence_dir}/deployment-run.json" \
            node --input-type=module -e '
              import { appendFileSync, readFileSync } from "node:fs";
              const run = JSON.parse(readFileSync(process.env.DEPLOYMENT_RUN_PATH, "utf8"));
              const assert = (condition, message) => {
                if (!condition) throw new Error(message);
              };
              assert(run.id === Number(process.env.DEPLOYMENT_RUN_ID), "Deployment run ID differs.");
              assert(run.run_attempt === Number(process.env.DEPLOYMENT_RUN_ATTEMPT), "Deployment attempt differs.");
              assert(run.repository?.full_name === process.env.GITHUB_REPOSITORY, "Deployment repository differs.");
              assert(/^[0-9a-f]{40}$/.test(run.head_sha), "Deployment SHA is invalid.");
              assert(run.head_branch === "main", "Deployment branch differs.");
              assert(run.event === "workflow_dispatch", "Deployment event differs.");
              assert(run.status === "completed", "Deployment run is not complete.");
              assert(["success", "failure"].includes(run.conclusion), "Deployment conclusion is not eligible for rollback.");
              assert(run.name === "Deploy Firebase rules to production", "Deployment workflow name differs.");
              assert(run.path === process.env.DEPLOYMENT_WORKFLOW_PATH, "Deployment workflow path differs.");
              appendFileSync(process.env.GITHUB_ENV, `SOURCE_DEPLOYMENT_SHA=${run.head_sha}\n`);
            '
      - name: Download the exact deployment evidence artifact
        id: download_deployment_evidence
        timeout-minutes: 6
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          DEPLOYMENT_RUN_ATTEMPT: ${{ inputs.deployment_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="firebase-rules-deployment-evidence-${DEPLOYMENT_RUN_ID}-${DEPLOYMENT_RUN_ATTEMPT}"
          deployment_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence/deployment"
          mkdir -p "$deployment_dir"
          gh run download "$DEPLOYMENT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir "$deployment_dir"
      - name: Verify deployment artifact provenance and hashes
        id: verify_deployment_evidence
        timeout-minutes: 4
        env:
          DEPLOYMENT_RUN_ID: ${{ inputs.deployment_run_id }}
          DEPLOYMENT_RUN_ATTEMPT: ${{ inputs.deployment_run_attempt }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence"
          deployment_dir="${evidence_dir}/deployment"
          node scripts/firebase/deployment-evidence-manifest.mjs verify \
            --manifest "${deployment_dir}/evidence-manifest.json" \
            --artifact-directory "$deployment_dir" \
            --type firebase-rules-deployment \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$SOURCE_DEPLOYMENT_SHA" \
            --run-id "$DEPLOYMENT_RUN_ID" \
            --run-attempt "$DEPLOYMENT_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --require-file rulesBefore \
            --require-file rulesBeforeVerification \
            --require-file rulesAfter \
            --require-file rollbackPreflight \
            --require-outcome armed=success \
            --require-outcome captureBefore=success \
            --require-outcome verifyBefore=success \
            --require-outcome dryRun=success \
            --require-outcome-one-of deploy=success,failure \
            --require-outcome captureAfter=success \
            --require-outcome rollbackPreflight=success \
            > "${evidence_dir}/deployment-manifest-verification.json"
      - name: Verify requested snapshot digests and typed confirmation
        id: verify_digests
        timeout-minutes: 2
        env:
          PRIOR_DIGEST: ${{ inputs.prior_snapshot_digest }}
          CURRENT_DIGEST: ${{ inputs.current_snapshot_digest }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence"
          deployment_dir="${evidence_dir}/deployment"
          PRIOR_SNAPSHOT="${deployment_dir}/rules-before.json" \
          CURRENT_SNAPSHOT="${deployment_dir}/rules-after.json" \
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const prior = JSON.parse(readFileSync(process.env.PRIOR_SNAPSHOT, "utf8"));
              const current = JSON.parse(readFileSync(process.env.CURRENT_SNAPSHOT, "utf8"));
              const expected = `ROLLBACK FIREBASE RULES ${process.env.FIREBASE_PROJECT_ID} FROM ${process.env.CURRENT_DIGEST} TO ${process.env.PRIOR_DIGEST}`;
              if (prior.snapshotDigestSha256 !== process.env.PRIOR_DIGEST) throw new Error("Prior digest differs.");
              if (current.snapshotDigestSha256 !== process.env.CURRENT_DIGEST) throw new Error("Current digest differs.");
              if (process.env.CONFIRMATION !== expected) throw new Error("Rollback confirmation differs.");
            '
      - name: Capture current live Rules state before rollback
        id: capture_current_rules
        timeout-minutes: 5
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.configure_credentials.outputs.access_token }}
        run: |
          node scripts/firebase/firebase-rules-state.mjs capture \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --output "${RUNNER_TEMP}/firebase-rules-rollback-evidence/rules-rollback-current.json"
      - name: Verify live release pointers still match the deployment artifact
        id: verify_current_rules
        timeout-minutes: 2
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence"
          LIVE_SNAPSHOT="${evidence_dir}/rules-rollback-current.json" \
          DEPLOYED_SNAPSHOT="${evidence_dir}/deployment/rules-after.json" \
          REPORT_PATH="${evidence_dir}/rules-rollback-current-verification.json" \
            node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              const live = JSON.parse(readFileSync(process.env.LIVE_SNAPSHOT, "utf8"));
              const deployed = JSON.parse(readFileSync(process.env.DEPLOYED_SNAPSHOT, "utf8"));
              const surfaces = ["firestore", "storage"];
              const pointers = {};
              for (const surface of surfaces) {
                const liveName = live.releases?.[surface]?.release?.rulesetName;
                const deployedName = deployed.releases?.[surface]?.release?.rulesetName;
                if (!liveName || liveName !== deployedName) throw new Error(`${surface} release pointer drifted.`);
                pointers[surface] = liveName;
              }
              writeFileSync(process.env.REPORT_PATH, `${JSON.stringify({ matches: true, pointers }, null, 2)}\n`, { mode: 0o600 });
            '
      - name: Apply the authorized Rules rollback
        id: apply_rollback
        timeout-minutes: 10
        continue-on-error: true
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.configure_credentials.outputs.access_token }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence"
          deployment_dir="${evidence_dir}/deployment"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          node scripts/firebase/firebase-rules-state.mjs rollback \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --prior-snapshot "${deployment_dir}/rules-before.json" \
            --current-snapshot "${deployment_dir}/rules-after.json" \
            --apply \
            --exclusive-deployment-lock \
            --confirmation "$CONFIRMATION" \
            --status-output "${evidence_dir}/rules-rollback-status.json" \
            2>&1 | tee "${evidence_dir}/rules-rollback.log"
          rollback_exit_code="${PIPESTATUS[0]}"
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{"exitCode":%s,"startedAt":"%s","finishedAt":"%s"}\n' \
            "$rollback_exit_code" "$started_at" "$finished_at" \
            > "${evidence_dir}/rules-rollback-command-status.json"
          exit "$rollback_exit_code"
      - name: Capture Rules state after the rollback attempt
        id: capture_after_rollback
        if: always() && steps.apply_rollback.outcome != 'skipped'
        timeout-minutes: 5
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.configure_credentials.outputs.access_token }}
        run: |
          node scripts/firebase/firebase-rules-state.mjs capture \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --output "${RUNNER_TEMP}/firebase-rules-rollback-evidence/rules-rollback-after.json"
      - name: Verify final release pointers match the prior snapshot
        id: verify_after_rollback
        if: always() && steps.apply_rollback.outcome != 'skipped'
        timeout-minutes: 2
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence"
          LIVE_SNAPSHOT="${evidence_dir}/rules-rollback-after.json" \
          PRIOR_SNAPSHOT="${evidence_dir}/deployment/rules-before.json" \
          REPORT_PATH="${evidence_dir}/rules-rollback-after-verification.json" \
            node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              const live = JSON.parse(readFileSync(process.env.LIVE_SNAPSHOT, "utf8"));
              const prior = JSON.parse(readFileSync(process.env.PRIOR_SNAPSHOT, "utf8"));
              const surfaces = ["firestore", "storage"];
              const pointers = {};
              for (const surface of surfaces) {
                const liveName = live.releases?.[surface]?.release?.rulesetName;
                const priorName = prior.releases?.[surface]?.release?.rulesetName;
                if (!liveName || liveName !== priorName) throw new Error(`${surface} rollback pointer differs.`);
                pointers[surface] = liveName;
              }
              writeFileSync(process.env.REPORT_PATH, `${JSON.stringify({ matches: true, pointers }, null, 2)}\n`, { mode: 0o600 });
            '
      - name: Create required rollback evidence manifest
        id: evidence_manifest
        if: always()
        timeout-minutes: 2
        env:
          ARMED_OUTCOME: ${{ steps.arm_target.outcome }}
          RUN_OUTCOME: ${{ steps.verify_deployment_run.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download_deployment_evidence.outcome }}
          DEPLOYMENT_EVIDENCE_OUTCOME: ${{ steps.verify_deployment_evidence.outcome }}
          DIGEST_OUTCOME: ${{ steps.verify_digests.outcome }}
          CAPTURE_CURRENT_OUTCOME: ${{ steps.capture_current_rules.outcome }}
          VERIFY_CURRENT_OUTCOME: ${{ steps.verify_current_rules.outcome }}
          APPLY_OUTCOME: ${{ steps.apply_rollback.outcome }}
          CAPTURE_AFTER_OUTCOME: ${{ steps.capture_after_rollback.outcome }}
          VERIFY_AFTER_OUTCOME: ${{ steps.verify_after_rollback.outcome }}
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence"
          node scripts/firebase/deployment-evidence-manifest.mjs create \
            --type firebase-rules-rollback \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow "$GITHUB_WORKFLOW" \
            --job rollback \
            --outcome "armed=${ARMED_OUTCOME:-unknown}" \
            --outcome "deploymentRun=${RUN_OUTCOME:-unknown}" \
            --outcome "download=${DOWNLOAD_OUTCOME:-unknown}" \
            --outcome "deploymentEvidence=${DEPLOYMENT_EVIDENCE_OUTCOME:-unknown}" \
            --outcome "digests=${DIGEST_OUTCOME:-unknown}" \
            --outcome "captureCurrent=${CAPTURE_CURRENT_OUTCOME:-unknown}" \
            --outcome "verifyCurrent=${VERIFY_CURRENT_OUTCOME:-unknown}" \
            --outcome "apply=${APPLY_OUTCOME:-unknown}" \
            --outcome "captureAfter=${CAPTURE_AFTER_OUTCOME:-unknown}" \
            --outcome "verifyAfter=${VERIFY_AFTER_OUTCOME:-unknown}" \
            --file "deploymentRun=${evidence_dir}/deployment-run.json" \
            --file "deploymentManifestVerification=${evidence_dir}/deployment-manifest-verification.json" \
            --file "rulesCurrent=${evidence_dir}/rules-rollback-current.json" \
            --file "rulesCurrentVerification=${evidence_dir}/rules-rollback-current-verification.json" \
            --file "rollbackLog=${evidence_dir}/rules-rollback.log" \
            --file "rollbackCommandStatus=${evidence_dir}/rules-rollback-command-status.json" \
            --file "rollbackStatus=${evidence_dir}/rules-rollback-status.json" \
            --file "rulesAfter=${evidence_dir}/rules-rollback-after.json" \
            --file "rulesAfterVerification=${evidence_dir}/rules-rollback-after-verification.json" \
            --output "${evidence_dir}/evidence-manifest.json"
      - name: Require complete rollback evidence
        id: verify_evidence_manifest
        if: always()
        timeout-minutes: 2
        run: |
          evidence_dir="${RUNNER_TEMP}/firebase-rules-rollback-evidence"
          node scripts/firebase/deployment-evidence-manifest.mjs verify \
            --manifest "${evidence_dir}/evidence-manifest.json" \
            --artifact-directory "$evidence_dir" \
            --type firebase-rules-rollback \
            --target "$FIREBASE_TARGET" \
            --project "$FIREBASE_PROJECT_ID" \
            --storage-bucket "$FIREBASE_STORAGE_BUCKET" \
            --database "$FIREBASE_DATABASE_ID" \
            --git-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --require-file deploymentRun \
            --require-file deploymentManifestVerification \
            --require-file rulesCurrent \
            --require-file rulesCurrentVerification \
            --require-file rollbackLog \
            --require-file rollbackCommandStatus \
            --require-file rollbackStatus \
            --require-file rulesAfter \
            --require-file rulesAfterVerification \
            --require-outcome armed=success \
            --require-outcome deploymentRun=success \
            --require-outcome download=success \
            --require-outcome deploymentEvidence=success \
            --require-outcome digests=success \
            --require-outcome captureCurrent=success \
            --require-outcome verifyCurrent=success \
            --require-outcome apply=success \
            --require-outcome captureAfter=success \
            --require-outcome verifyAfter=success \
            > "${evidence_dir}/evidence-manifest-verification.json"
      - name: Upload Rules rollback evidence
        id: upload_evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-rules-rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firebase-rules-rollback-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary credentials
        id: cleanup_credentials
        if: always()
        timeout-minutes: 1
        run: |
          if [[ -n "${GOOGLE_GHA_CREDS_PATH:-}" ]]; then
            rm -f "$GOOGLE_GHA_CREDS_PATH"
          fi
      - name: Reject any failed rollback or evidence step
        if: always()
        timeout-minutes: 1
        env:
          APPLY_OUTCOME: ${{ steps.apply_rollback.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.verify_evidence_manifest.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          [[ "$APPLY_OUTCOME" == "success" ]]
          [[ "$EVIDENCE_OUTCOME" == "success" ]]
          [[ "$UPLOAD_OUTCOME" == "success" ]]

  close-record:
    name: Close deploy record
    needs: [open-record, rollback]
    if: always() && needs.open-record.result == 'success'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy-record.yml
    with:
      surface: Rules rollback
      git_sha: ${{ inputs.git_sha }}
      action: close
      outcome: ${{ needs.rollback.result }}
