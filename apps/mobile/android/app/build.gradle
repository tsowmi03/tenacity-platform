plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.example.tenacity"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file("$rootDir/my-release-key.jks")
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    defaultConfig {
        applicationId = "com.tenacityTutoring.tenacity"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Two environments, each with its own applicationId so a staging build can
    // sit alongside production on the same device and can never be promoted to
    // Play by accident.
    //
    // google-services.json is resolved per flavor from
    // android/app/src/<flavor>/google-services.json. It deliberately no longer
    // exists at android/app/google-services.json: that path is a fallback for
    // EVERY flavor, so leaving it there would silently give staging builds the
    // production Firebase project.
    flavorDimensions "env"
    productFlavors {
        prod {
            dimension "env"
            resValue "string", "app_name", "Tenacity"
            // Unchanged from what shipped previously. NOTE: this is a
            // different Stripe account from the pk_live_51Svtsi... key that
            // Remote Config serves and that flutter_stripe actually applies at
            // runtime. It carried a "Replace with your actual key" comment and
            // is believed stale — pending confirmation against the Stripe
            // dashboard before it is changed or removed.
            manifestPlaceholders = [
                stripePublishableKey: "pk_live_51NGMmNGpgjvnJDO9zhbXT7favNqfHvtjgFnDJPEg17jCK0jw58hstNV0LPsC0dK2WRz3HcVA782744HQlPdCnTGA00pVht7EnC"
            ]
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "Tenacity STG"
            // Test-mode key only. Fill in from the staging Stripe account.
            manifestPlaceholders = [stripePublishableKey: ""]
        }
    }

    buildTypes {
        release {
            // Use the release signing config instead of the debug config.
            signingConfig signingConfigs.release

            // Enable code shrinking and resource shrinking
            minifyEnabled true
            shrinkResources true

            // Use the default and your custom ProGuard rules
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.stripe:stripe-android:20.44.0'
}

flutter {
    source = "../.."
}
