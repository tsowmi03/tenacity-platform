<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Tenacity Tutoring</title>
    <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.4.0/firebase-auth-compat.js"></script>
    <style>
      :root {
        --bg-top: #f5f7fa;
        --bg-bottom: #c3cfe2;
        --text: #111827;
        --muted: #6b7280;
        --border: rgba(17, 24, 39, 0.16);
        --focus: rgba(0, 123, 255, 0.25);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(to right, var(--bg-top), var(--bg-bottom));
      }

      .container {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 12px 40px rgba(17, 24, 39, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
        text-align: center;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        text-align: center;
        line-height: 1.4;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        color: var(--muted);
        font-size: 13px;
      }

      input[type="password"] {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 15px;
      }

      input[type="password"]:focus {
        outline: none;
        border-color: rgba(0, 123, 255, 0.55);
        box-shadow: 0 0 0 4px var(--focus);
      }

      button {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        border: 0;
        border-radius: 8px;
        background: #007bff;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        font-weight: 700;
      }

      button:hover {
        background: #0056b3;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      #message {
        margin-top: 16px;
        text-align: center;
        line-height: 1.4;
      }

      .error {
        color: #b00020;
      }

      .success {
        color: #1f7a3f;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Reset Password</h1>
      <p>Set a new password for your Tenacity Tutoring account.</p>

      <form id="resetForm">
        <label for="newPassword">New password</label>
        <input
          type="password"
          id="newPassword"
          autocomplete="new-password"
          minlength="6"
          required
        />

        <label for="confirmPassword">Confirm password</label>
        <input
          type="password"
          id="confirmPassword"
          autocomplete="new-password"
          minlength="6"
          required
        />

        <button id="submitButton" type="submit">Reset Password</button>
      </form>

      <div id="message"></div>
    </main>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBpaPKw8yHZ-LoYlJo4RGjxKi_p-ZOs2ic",
        authDomain: "tenacity-tutoring-b8eb2.firebaseapp.com",
        projectId: "tenacity-tutoring-b8eb2",
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      const form = document.getElementById("resetForm");
      const message = document.getElementById("message");
      const submitButton = document.getElementById("submitButton");
      const urlParams = new URLSearchParams(window.location.search);
      const oobCode = urlParams.get("oobCode");

      function setMessage(text, className) {
        message.textContent = text;
        message.className = className || "";
      }

      if (!oobCode) {
        form.hidden = true;
        setMessage(
          "This password reset link is missing a reset code. Please request a new password reset email.",
          "error"
        );
      } else {
        auth.verifyPasswordResetCode(oobCode).catch(() => {
          form.hidden = true;
          setMessage(
            "This password reset link is invalid or has expired. Please request a new password reset email.",
            "error"
          );
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
          setMessage("Passwords do not match.", "error");
          return;
        }

        submitButton.disabled = true;
        setMessage("Resetting password...");

        try {
          await auth.confirmPasswordReset(oobCode, newPassword);
          form.hidden = true;
          setMessage(
            "Your password has been reset. You can now log in to the Tenacity Tutoring app.",
            "success"
          );
        } catch (error) {
          submitButton.disabled = false;
          setMessage(error.message || "Failed to reset password.", "error");
        }
      });
    </script>
  </body>
</html>
