name: Deploy Hosting

# Builds the frontend and deploys it to Firebase Hosting (live channel) on every
# push to main, using a service-account secret so no personal `firebase login`
# is ever needed. Can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: tenacity-tutoring-b8eb2
