<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tenacity Portal · Admin</title>
  <link rel="icon" type="image/png" href="assets/logo-icon.png" />

  <!-- Type: Manrope (display) + Plus Jakarta Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="root">
    <!-- Initial loading state (replaced once React mounts) -->
    <div style="height:100vh; display:grid; place-items:center; background:var(--ink-50);">
      <div style="text-align:center;">
        <div style="width:54px; height:54px; margin:0 auto 18px; background:linear-gradient(135deg, var(--brand-navy), var(--brand-blue)); border-radius:14px; display:grid; place-items:center;">
          <img src="assets/logo-icon.png" alt="" style="width:36px; height:36px;" />
        </div>
        <div style="font-family:'Manrope', sans-serif; font-weight:800; font-size:20px; letter-spacing:0.04em; color:var(--brand-navy);">TENACITY</div>
        <div style="font-size:11px; letter-spacing:0.14em; color:var(--brand-blue); text-transform:uppercase; font-weight:600; margin-top:6px;">Loading portal…</div>
      </div>
    </div>
  </div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- App scripts -->
  <script type="text/babel" src="js/ui.jsx"></script>
  <script type="text/babel" src="js/mock.jsx"></script>
  <script type="text/babel" src="js/views/dashboard.jsx"></script>
  <script type="text/babel" src="js/views/enrolments.jsx"></script>
  <script type="text/babel" src="js/views/people.jsx"></script>
  <script type="text/babel" src="js/views/classes.jsx"></script>
  <script type="text/babel" src="js/views/attendance.jsx"></script>
  <script type="text/babel" src="js/views/waitlist.jsx"></script>
  <script type="text/babel" src="js/views/invoices.jsx"></script>
  <script type="text/babel" src="js/views/reports.jsx"></script>
  <script type="text/babel" src="js/views/settings.jsx"></script>
  <script type="text/babel" src="js/app.jsx"></script>

  <!-- Mount -->
  <script type="text/babel" data-presets="env,react">
    // Wait for all babel scripts to finish executing before mounting.
    // Babel transforms script tags one-by-one; this final one runs last.
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
