<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enrolment Portal - Tenacity Tutoring</title>

    <style>
      :root {
        --bg-top: #f5f7fa;
        --bg-bottom: #c3cfe2;
        --card: #ffffff;
        --muted: #6b7280;
        --text: #111827;
        --border: rgba(17, 24, 39, 0.12);
        --shadow: 0 12px 40px rgba(17, 24, 39, 0.12);
        --shadow-soft: 0 6px 18px rgba(17, 24, 39, 0.08);
        --radius: 14px;
        --radius-sm: 10px;
        --focus: rgba(0, 123, 255, 0.25);
      }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
          "Segoe UI Emoji";
        background: radial-gradient(
            1100px circle at 20% 0%,
            rgba(255, 255, 255, 0.75),
            rgba(255, 255, 255, 0) 60%
          ),
          linear-gradient(to right, var(--bg-top), var(--bg-bottom));
        margin: 0;
        padding: 0;
        color: var(--text);
      }

      #root {
        padding: 0;
      }

      .pageCenter {
        min-height: 100vh;
        padding: 48px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        max-width: 500px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.8);
        padding: 28px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
      }

      .appShell {
        min-height: 100vh;
        padding: 20px;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 18px;
      }

      .sidebar {
        position: sticky;
        top: 20px;
        height: calc(100vh - 40px);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow-soft);
        backdrop-filter: blur(10px);
        padding: 16px;
        display: flex;
        flex-direction: column;
        overflow: auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.6);
      }

      .brandLogo {
        width: 44px;
        height: 44px;
        object-fit: contain;
      }

      .brandTitle {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.1;
      }

      .brandSubtitle {
        margin-top: 2px;
        font-size: 12px;
        color: var(--muted);
      }

      .nav {
        margin-top: 14px;
        display: grid;
        gap: 8px;
      }

      .navItem {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(17, 24, 39, 0.04);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
        transition: background 120ms ease, transform 80ms ease;
      }

      .navItem:hover {
        background: rgba(17, 24, 39, 0.07);
      }

      .navItem:active {
        transform: translateY(1px);
      }

      .navItemPrimary {
        background: linear-gradient(
          180deg,
          rgba(0, 123, 255, 0.92) 0%,
          rgba(0, 86, 179, 0.92) 100%
        );
        border: 0;
        color: #fff;
      }

      .navItemPrimary:hover {
        filter: brightness(1.03);
      }

      .sidebarFooter {
        margin-top: auto;
        padding-top: 12px;
        display: grid;
        gap: 10px;
      }

      .userChip {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.6);
      }

      .userEmail {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.01em;
        word-break: break-word;
      }

      .userRole {
        margin-top: 2px;
        font-size: 12px;
        color: var(--muted);
      }

      .main {
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        padding: 18px;
        min-width: 0;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 4px 16px;
        border-bottom: 1px solid rgba(17, 24, 39, 0.08);
      }

      .pageTitle {
        margin: 0;
        font-size: 22px;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .pageSubtitle {
        margin: 6px 0 0;
        font-size: 14px;
        color: var(--muted);
      }

      .contentGrid {
        margin-top: 16px;
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 14px;
      }

      .card {
        grid-column: span 6;
        padding: 16px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.75);
        box-shadow: var(--shadow-soft);
        min-width: 0;
      }

      .cardTitle {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .cardBody {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 900px) {
        .appShell {
          grid-template-columns: 1fr;
          padding: 16px;
        }

        .sidebar {
          position: relative;
          top: auto;
          height: auto;
        }

        .contentGrid {
          grid-template-columns: 1fr;
        }

        .card {
          grid-column: 1 / -1;
        }
      }

      .header {
        text-align: center;
        margin-bottom: 18px;
      }

      .logo {
        display: block;
        margin: 0 auto 14px;
        max-width: 350px;
        width: 350px;
        height: auto;
      }

      h1 {
        text-align: center;
        color: var(--text);
        margin: 0;
        letter-spacing: -0.02em;
        font-size: 24px;
        line-height: 1.15;
      }

      .subtitle {
        text-align: center;
        margin: 8px 0 0;
        font-size: 14px;
        color: var(--muted);
      }

      .section {
        margin-top: 16px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow-soft);
      }

      .field {
        display: block;
        width: 100%;
        margin-top: 10px;
      }

      .label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 12px 12px;
        margin: 0;
        border: 1px solid rgba(17, 24, 39, 0.18);
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 15px;
        background: rgba(255, 255, 255, 0.95);
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      input[type="email"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: rgba(0, 123, 255, 0.55);
        box-shadow: 0 0 0 4px var(--focus);
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        background: linear-gradient(
          180deg,
          rgba(0, 123, 255, 1) 0%,
          rgba(0, 86, 179, 1) 100%
        );
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 80ms ease, filter 120ms ease;
      }

      button:hover {
        filter: brightness(1.03);
      }

      button:active {
        transform: translateY(1px);
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .buttonRow {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .buttonRow > button {
        width: auto;
        flex: 1;
      }

      .buttonSecondary {
        background: rgba(17, 24, 39, 0.06);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .buttonSecondary:hover {
        filter: none;
        background: rgba(17, 24, 39, 0.08);
      }

      .userInfo {
        text-align: center;
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      .result {
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
        color: #28a745;
        word-break: break-word;
      }

      .error {
        color: #b00020;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 0.95em;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
